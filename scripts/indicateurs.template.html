<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Indicateurs — Dashboard CAE</title>
<style>
  :root{--bg:#fff;--surface-2:#F5F5F6;--line:#E4E4E8;--red:#E2173B;--text:#0F0F11;--muted:#75757C;--sharp:2px;}
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.45;}
  header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;border-bottom:1px solid var(--line);}
  h1{margin:0 0 6px;font-size:20px;font-weight:800;text-transform:uppercase;letter-spacing:-.01em;}
  h1 em{color:var(--red);font-style:normal;}
  input[type=search]{width:100%;max-width:520px;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--sharp);}
  .count{font-size:12px;color:var(--muted);margin-top:5px;}
  main{padding:0 0 60px;overflow-x:auto;}
  table{border-collapse:collapse;width:100%;min-width:1100px;font-size:12.5px;}
  th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:8px;border-bottom:2px solid var(--red);white-space:nowrap;}
  td{vertical-align:top;padding:8px;border-bottom:1px solid var(--line);}
  td.n{font-weight:700;min-width:150px;}
  .sub{display:block;margin-top:4px;color:var(--muted);font-size:11.5px;}
  .sub b{color:var(--text);}
  code{background:var(--surface-2);padding:1px 4px;border-radius:var(--sharp);font-size:11.5px;}
  .tt{margin:0 0 4px;} .tt b{font-weight:700;}
  .empty{text-align:center;color:var(--muted);padding:30px;font-size:13px;}
</style>
</head>
<body>
<header>
  <h1>Indicateurs <em>◆</em> définitions</h1>
  <input type="search" id="q" placeholder="Rechercher un indicateur, une table, une variable, un dashboard…" autofocus>
  <div class="count" id="count"></div>
</header>
<main>
  <table>
    <thead><tr><th>Indicateur</th><th>Formule de calcul</th><th>Format d’affichage</th><th>Définition technique</th><th>Tooltips associés</th></tr></thead>
    <tbody id="list"></tbody>
  </table>
</main>
<script>
(function(){
  var isStaging = new URLSearchParams(window.location.search).get('staging') === '1';
  if (!isStaging) return;
  document.addEventListener('DOMContentLoaded', function(){
    var b = document.createElement('div');
    b.textContent = '◆ STAGING';
    b.style.cssText = 'position:fixed;bottom:14px;right:14px;z-index:9999;font-family:ui-monospace,Consolas,monospace;font-size:11px;font-weight:700;background:#E2173B;color:#fff;padding:5px 9px;border-radius:2px;';
    document.body.appendChild(b);
  });
})();
var DATA = /*__DATA__*/null;
var strip = function(s){ return s.replace(/<[^>]+>/g,''); };
var norm = function(s){ return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); };
function render(q){
  var terms = norm(q).split(/\s+/).filter(Boolean);
  var shown = DATA.indicateurs.filter(function(i){
    var hay = norm([i.n,strip(i.d),strip(i.p),i.f,i.v,i.e,i.fmt,i.tt.map(function(x){return x.l+' '+x.t;}).join(' ')].join(' '));
    return terms.every(function(t){ return hay.indexOf(t) >= 0; });
  });
  document.getElementById('count').textContent = shown.length + ' indicateur' + (shown.length>1?'s':'') + ' sur ' + DATA.indicateurs.length;
  document.getElementById('list').innerHTML = shown.length ? shown.map(function(i){
    return '<tr><td class="n">'+i.n+'</td>'
      +'<td>'+i.f+(i.v?'<span class="sub"><b>Tables / variables :</b> <code>'+i.v+'</code></span>':'')+(i.e?'<span class="sub"><b>Exemple :</b> '+i.e+'</span>':'')+'</td>'
      +'<td>'+i.fmt+'</td>'
      +'<td>'+i.d+'<span class="sub"><b>Où :</b> '+i.p+'</span></td>'
      +'<td>'+(i.tt.length?i.tt.map(function(x){return '<div class="tt"><b>'+x.l+'</b> : '+x.t+'</div>';}).join(''):'<span class="sub">—</span>')+'</td></tr>';
  }).join('') : '<tr><td colspan="5" class="empty">Aucun indicateur ne correspond.</td></tr>';
}
document.getElementById('q').addEventListener('input', function(e){ render(e.target.value); });
render('');
</script>
</body>
</html>
