name = "cae-dashboard"
main = "src/index.js"
compatibility_date = "2026-07-11"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Secrets requis (jamais dans le dépôt : `npx wrangler secret put <NOM>`).
# PLANNING_PASSWORD protège /moteur-planning (cf. src/lib/planning-auth.js).
# Wrangler refuse le déploiement si un secret listé ici n'existe pas encore.
[secrets]
required = ["PLANNING_PASSWORD"]
