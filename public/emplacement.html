<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fiche emplacement — Dashboard CAE</title>
<style>
  :root{
    --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F5F6; --line:#E4E4E8;
    --red:#E2173B; --text:#0F0F11; --muted:#75757C;
    --sharp:2px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important; transition-duration:.001ms !important;}}

  header{position:sticky; top:0; z-index:20; background:rgba(255,255,255,.92); backdrop-filter:blur(8px);
    padding:calc(env(safe-area-inset-top) + 14px) 16px 12px; border-bottom:1px solid var(--line);}
  .tab-bar{display:flex; gap:8px; margin-bottom:12px;}
  .tab-link{flex:1; text-align:center; padding:8px 10px; border-radius:var(--sharp); border:1px solid var(--line);
    background:#fff; color:var(--muted); font-size:12.5px; font-weight:700; text-decoration:none;
    text-transform:uppercase; letter-spacing:.03em;}
  .tab-link.active{background:var(--red); border-color:var(--red); color:#fff;}
  h1{margin:0 0 4px; font-size:20px; font-weight:800; letter-spacing:-.01em; line-height:1.2; text-transform:uppercase;}
  h1 em{color:var(--red); font-style:normal;}
  .sub{font-size:12.5px; color:var(--muted); margin-bottom:2px;}
  .error-banner{margin-top:12px; padding:10px 12px; border:1px solid var(--line); border-left:3px solid var(--red);
    background:#FFF6F7; font-size:12px; color:#7A1225; display:none; line-height:1.5;}
  .error-banner.show{display:block;}
  .error-banner b{color:var(--red);}

  main{padding:4px 16px 40px; max-width:900px; margin:0 auto;}

  .search-box{margin-top:16px;}
  .search-input{width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:var(--sharp);
    font-size:15px; font-family:inherit;}
  .search-results{margin-top:10px; border:1px solid var(--line); border-radius:var(--sharp); overflow:hidden;}
  .search-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px;
    border-bottom:1px solid var(--line); cursor:pointer;}
  .search-row:last-child{border-bottom:none;}
  .search-row:hover{background:var(--surface-2);}
  .search-name{font-weight:700; font-size:14.5px;}
  .search-sub{font-size:11px; color:var(--muted);}
  .search-empty{padding:20px 14px; text-align:center; color:var(--muted); font-size:13px;}

  .profile-card{background:#fff; border:1px solid var(--line); border-radius:var(--sharp); padding:18px;
    margin-top:16px;}
  .profile-name{font-size:22px; font-weight:800; text-transform:uppercase; letter-spacing:-.01em;}
  .profile-sub{font-size:13px; color:var(--muted); margin-top:4px;}
  .badge-row{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}
  .badge{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.03em;
    padding:4px 8px; border-radius:var(--sharp); background:var(--surface-2); color:var(--muted);}

  .section-label{display:flex; align-items:center; gap:6px; font-size:10px; text-transform:uppercase;
    letter-spacing:.08em; color:var(--muted); font-weight:700; margin:22px 2px 8px;}
  .section-label .diamond{width:6px; height:6px; background:var(--red); transform:rotate(45deg); flex:0 0 auto;}

  .mission-list, .leaderboard{background:#fff; border:1px solid var(--line); border-radius:var(--sharp); overflow:hidden;}
  .mission-row{display:flex; align-items:center; gap:12px; padding:12px 14px; border-bottom:1px solid var(--line);}
  .mission-row:last-child{border-bottom:none;}
  .mission-body{flex:1 1 auto; min-width:0;}
  .mission-name{font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .mission-sub{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .mission-vals{text-align:right; flex:0 0 auto;}
  .mission-vals .taux{font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:15px; font-weight:800;}
  .mission-vals .bs{font-size:10.5px; color:var(--muted); margin-top:1px;}

  .row{display:flex; align-items:center; gap:12px; padding:12px 14px; border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:none;}
  .row.current{background:#FFF6F7;}
  .rank-num{font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-weight:800; font-size:14px;
    width:26px; height:26px; flex:0 0 auto; border-radius:var(--sharp); display:flex; align-items:center;
    justify-content:center; background:var(--surface-2); color:var(--muted);}
  .row.current .rank-num{background:var(--red); color:#fff;}
  .row-body{flex:1 1 auto; min-width:0;}
  .row-name{font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .row-sub{font-size:11.5px; color:var(--muted); margin-top:1px;}
  .row-val{font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:15px; font-weight:800; flex:0 0 auto;}

  .empty{padding:24px 16px; text-align:center; color:var(--muted); font-size:13px;}
</style>
</head>
<body>

<header>
  <div class="tab-bar">
    <a class="tab-link" href="rm.html">Missions</a>
    <a class="tab-link" href="salarie.html">Salarié</a>
    <a class="tab-link active" href="emplacement.html">Emplacement</a>
  </div>
  <h1>Fiche <em>emplacement</em></h1>
  <div class="sub" id="subLabel">Recherchez un lieu par nom ou ville</div>
  <div class="error-banner" id="errorBanner">
    <b>Connexion impossible.</b> <span id="errorDetail"></span>
  </div>
</header>

<main id="content">
  <div class="search-box" id="searchBox">
    <input class="search-input" id="searchInput" type="text" placeholder="Nom du lieu ou ville…" autocomplete="off">
    <div class="search-results" id="searchResults"></div>
  </div>

  <div id="profileArea" style="display:none;"></div>
</main>

<script>
(function () {
  function fmtNum(n, digits = 0) {
    if (n === null || n === undefined) return '—';
    return Number(n).toLocaleString('fr-FR', { maximumFractionDigits: digits, minimumFractionDigits: digits });
  }
  function fmtDate(d) {
    if (!d) return '—';
    return new Date(d).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }
  function showError(msg) {
    document.getElementById('errorDetail').textContent = msg;
    document.getElementById('errorBanner').classList.add('show');
  }
  function clearError() {
    document.getElementById('errorBanner').classList.remove('show');
  }

  const qs = new URLSearchParams(window.location.search);
  const idEmplacement = qs.get('id_emplacement');

  if (idEmplacement) {
    document.getElementById('searchBox').style.display = 'none';
    loadFiche(idEmplacement);
  } else {
    setupSearch();
  }

  function setupSearch() {
    const input = document.getElementById('searchInput');
    const results = document.getElementById('searchResults');
    let debounce;
    input.addEventListener('input', () => {
      clearTimeout(debounce);
      const q = input.value.trim();
      if (q.length < 2) { results.innerHTML = ''; return; }
      debounce = setTimeout(() => runSearch(q), 300);
    });

    async function runSearch(q) {
      try {
        const res = await fetch('/api/emplacement-recherche?q=' + encodeURIComponent(q), { cache: 'no-store' });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || 'Erreur inconnue');
        clearError();
        renderResults(data.results || []);
      } catch (err) {
        showError(err.message);
      }
    }

    function renderResults(rows) {
      if (!rows.length) {
        results.innerHTML = '<div class="search-empty">Aucun résultat</div>';
        return;
      }
      results.innerHTML = rows.map((r) => `
        <div class="search-row" data-id="${r.id}">
          <div>
            <div class="search-name">${r.nom || 'Emplacement'}</div>
            <div class="search-sub">${r.ville || ''}</div>
          </div>
          <div class="search-sub">${fmtNum(r.nb_missions)} mission(s)</div>
        </div>`).join('');
      results.querySelectorAll('.search-row').forEach((el) => {
        el.addEventListener('click', () => {
          window.location.search = '?id_emplacement=' + encodeURIComponent(el.dataset.id);
        });
      });
    }
  }

  async function loadFiche(id) {
    try {
      const res = await fetch('/api/emplacement?id_emplacement=' + encodeURIComponent(id), { cache: 'no-store' });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.message || data.error || 'Erreur inconnue');
      clearError();
      renderFiche(id, data);
    } catch (err) {
      showError(err.message);
    }
  }

  function renderFiche(id, data) {
    const area = document.getElementById('profileArea');
    area.style.display = 'block';

    const info = data.info || {};
    document.getElementById('subLabel').textContent = [info.adresse, info.code_postal, info.ville]
      .filter(Boolean).join(' · ');

    const missions = data.missions || [];
    const totalBs = missions.reduce((s, m) => s + (Number(m.bs_reel) || 0), 0);
    const totalHeures = missions.reduce((s, m) => s + (Number(m.heures_rue) || 0), 0);
    const tauxGlobal = totalHeures > 0 ? totalBs / totalHeures : null;

    area.innerHTML = `
      <div class="profile-card">
        <div class="profile-name">${info.nom || 'Emplacement'}</div>
        <div class="profile-sub">${[info.type_emplacement, info.categorie].filter(Boolean).join(' · ')}</div>
        <div class="badge-row">
          <span class="badge">${fmtNum(missions.length)} mission(s)</span>
          <span class="badge">${fmtNum(totalBs)} BS réel cumulé</span>
          <span class="badge">${tauxGlobal != null ? fmtNum(tauxGlobal, 3) : '—'} taux réel global</span>
        </div>
      </div>

      <div class="section-label"><span class="diamond"></span>Missions passées ici</div>
      <div class="mission-list" id="missionList"></div>

      <div class="section-label"><span class="diamond"></span>Comparaison — meilleurs emplacements (taux réel)</div>
      <div class="leaderboard" id="comparaisonList"></div>
    `;

    const missionList = document.getElementById('missionList');
    if (!missions.length) {
      missionList.innerHTML = '<div class="empty">Aucune mission enregistrée à cet emplacement</div>';
    } else {
      missionList.innerHTML = missions.map((m) => {
        const missionLabel = m.code_mission || m.code_mission_client || 'Mission';
        const sub = [m.client_nom, fmtDate(m.premiere_date) + ' → ' + fmtDate(m.derniere_date), fmtNum(m.nb_jours) + ' j']
          .filter(Boolean).join(' · ');
        return `
        <div class="mission-row">
          <div class="mission-body">
            <div class="mission-name">${missionLabel}</div>
            <div class="mission-sub">${sub}</div>
          </div>
          <div class="mission-vals">
            <div class="taux">${m.taux_reel != null ? fmtNum(m.taux_reel, 3) : '—'}</div>
            <div class="bs">${fmtNum(m.bs_reel)} BS réel</div>
          </div>
        </div>`;
      }).join('');
    }

    const comparaisonList = document.getElementById('comparaisonList');
    const comparaison = data.comparaison || [];
    if (!comparaison.length) {
      comparaisonList.innerHTML = '<div class="empty">Pas assez de données pour comparer</div>';
    } else {
      comparaisonList.innerHTML = comparaison.map((e, i) => {
        const isCurrent = e.id === id;
        return `
        <div class="row ${isCurrent ? 'current' : ''}">
          <div class="rank-num">${i + 1}</div>
          <div class="row-body">
            <div class="row-name">${e.nom || 'Emplacement'}${isCurrent ? ' (ici)' : ''}</div>
            <div class="row-sub">${e.ville || ''}</div>
          </div>
          <div class="row-val">${e.taux_reel != null ? fmtNum(e.taux_reel, 3) : '—'}</div>
        </div>`;
      }).join('');
    }
  }
})();
</script>

</body>
</html>
