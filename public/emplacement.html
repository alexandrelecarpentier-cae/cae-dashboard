<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fiche emplacement — Dashboard CAE</title>
<style>
  :root{
    --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F5F6; --line:#E4E4E8;
    --red:#E2173B; --text:#0F0F11; --muted:#75757C;
    --sharp:2px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important; transition-duration:.001ms !important;}}

  header{position:sticky; top:0; z-index:20; background:rgba(255,255,255,.92); backdrop-filter:blur(8px);
    padding:calc(env(safe-area-inset-top) + 14px) 16px 12px; border-bottom:1px solid var(--line);}
  h1{margin:0 0 4px; font-size:20px; font-weight:800; letter-spacing:-.01em; line-height:1.2; text-transform:uppercase;}
  h1 em{color:var(--red); font-style:normal;}
  .sub{font-size:12.5px; color:var(--muted); margin-bottom:2px;}

  .meta-row{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:10px;}
  .sync{font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:11.5px; color:var(--muted); display:flex; align-items:center; gap:6px;}
  .sync b{color:var(--text); font-weight:600;}
  .live-diamond{width:7px; height:7px; background:var(--red); transform:rotate(45deg); flex:0 0 auto; animation:pulse 2.2s infinite;}
  .live-diamond.off{background:#C7C7CC; animation:none;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(226,23,59,.45);}70%{box-shadow:0 0 0 7px rgba(226,23,59,0);}100%{box-shadow:0 0 0 0 rgba(226,23,59,0);}}
  #refreshBar{height:2px; width:100%; background:var(--line); overflow:hidden; margin-top:8px;}
  #refreshFill{height:100%; width:0%; background:var(--red); transition:width 1s linear;}

  .error-banner{margin-top:12px; padding:10px 12px; border:1px solid var(--line); border-left:3px solid var(--red);
    background:#FFF6F7; font-size:12px; color:#7A1225; display:none; line-height:1.5;}
  .error-banner.show{display:block;}
  .error-banner b{color:var(--red);}

  main{padding:4px 16px 40px; max-width:1000px; margin:0 auto;}

  .profile-card{background:#fff; border:1px solid var(--line); border-radius:var(--sharp); padding:18px;
    margin-top:16px;}
  .profile-name{font-size:22px; font-weight:800; text-transform:uppercase; letter-spacing:-.01em;}
  .profile-sub{font-size:13px; color:var(--muted); margin-top:4px;}

  .section-label{display:flex; align-items:center; gap:6px; font-size:10px; text-transform:uppercase;
    letter-spacing:.08em; color:var(--muted); font-weight:700; margin:22px 2px 8px;}
  .section-label .diamond{width:6px; height:6px; background:var(--red); transform:rotate(45deg); flex:0 0 auto;}

  .kpi-scroll{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  @media (min-width:480px){ .kpi-scroll{grid-template-columns:repeat(3,1fr);} }
  @media (min-width:720px){ .kpi-scroll{grid-template-columns:repeat(6,1fr);} }
  .kpi{background:var(--surface-2);
    border:1px solid var(--line); border-left:2px solid var(--red); border-radius:var(--sharp); padding:12px 14px;}
  .kpi .val{font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:20px; font-weight:700; line-height:1;}
  .kpi .lbl{font-size:10px; color:var(--muted); margin-top:6px; text-transform:uppercase; letter-spacing:.05em;}

  .card{background:#fff; border:1px solid var(--line); border-radius:var(--sharp); padding:14px 14px 12px; margin-bottom:10px;
    position:relative; overflow:hidden; box-shadow:0 1px 2px rgba(15,15,17,.03);}
  .card::before{content:""; position:absolute; top:0; left:0; width:3px; height:100%; background:var(--red);}
  .card-inner{padding-left:6px;}
  .chart-box{position:relative; height:220px;}
  .chart-empty{display:flex; align-items:center; justify-content:center; height:220px; color:var(--muted); font-size:13px;}
  .chart-grid{display:grid; grid-template-columns:1fr; gap:10px;}
  @media (min-width:720px){ .chart-grid{grid-template-columns:1fr 1fr;} }
  .chart-title{font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px;}

  .mission-card{background:#fff; border:1px solid var(--line); border-radius:var(--sharp); padding:14px; margin-bottom:10px;}
  .mission-head{display:flex; align-items:center; gap:12px;}
  .client-avatar{width:32px; height:32px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center;
    justify-content:center; color:#fff; font-weight:800; font-size:11px; font-family:ui-monospace,monospace;
    letter-spacing:.02em;}
  .client-avatar.client-logo{object-fit:cover; background:var(--surface-2); border:1px solid var(--line);}
  .mission-body{flex:1 1 auto; min-width:0;}
  .mission-name{font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .mission-sub{font-size:11.5px; color:var(--muted); margin-top:2px;}

  .mission-stats{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:12px;}
  @media (min-width:480px){ .mission-stats{grid-template-columns:repeat(4,1fr);} }
  .stat{background:var(--surface-2); border-radius:var(--sharp); padding:8px 10px;}
  .stat .stat-val{font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:14.5px; font-weight:700;}
  .stat .stat-lbl{font-size:9.5px; color:var(--muted); margin-top:3px; text-transform:uppercase; letter-spacing:.04em;}

  .dates-label{margin-top:10px; font-size:9.5px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em;}
  .dates-chips{display:flex; flex-wrap:wrap; gap:5px; margin-top:6px;}
  .date-chip{font-size:10.5px; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; background:var(--surface-2);
    border:1px solid var(--line); border-radius:var(--sharp); padding:3px 7px; color:var(--text); white-space:nowrap;}

  .empty{padding:24px 16px; text-align:center; color:var(--muted); font-size:13px;}
</style>
</head>
<body>

<header>
  <h1>Fiche <em>emplacement</em></h1>
  <div class="sub" id="subLabel"></div>
  <div class="meta-row">
    <div class="sync"><span class="live-diamond off" id="liveDiamond"></span>Synchro <b id="syncTime">—</b></div>
    <div class="sync mono" id="countdown">5:00</div>
  </div>
  <div id="refreshBar"><div id="refreshFill"></div></div>
  <div class="error-banner" id="errorBanner">
    <b>Connexion impossible.</b> <span id="errorDetail"></span> La page réessaiera automatiquement.
  </div>
</header>

<main id="content">
  <div id="profileArea" style="display:none;"></div>
</main>

<script>
(function () {
  function fmtNum(n, digits = 0) {
    if (n === null || n === undefined) return '—';
    return Number(n).toLocaleString('fr-FR', { maximumFractionDigits: digits, minimumFractionDigits: digits });
  }
  function fmtEuro(n) {
    if (n === null || n === undefined) return '—';
    return fmtNum(n, 2) + '€';
  }
  function fmtDate(d) {
    if (!d) return '—';
    return new Date(d).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }
  // Format "lundi 12/04/26" à partir d'une date AAAA-MM-JJ (jour de lot =
  // présence réelle des recruteurs à cet emplacement).
  const DAYS_FR = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
  function fmtDateLong(iso) {
    const d = new Date(iso + 'T00:00:00');
    if (isNaN(d.getTime())) return iso;
    const dayName = DAYS_FR[d.getDay()];
    const dd = String(d.getDate()).padStart(2, '0');
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const yy = String(d.getFullYear()).slice(-2);
    return `${dayName} ${dd}/${mm}/${yy}`;
  }
  function showError(msg) {
    document.getElementById('errorDetail').textContent = msg;
    document.getElementById('errorBanner').classList.add('show');
  }
  function clearError() {
    document.getElementById('errorBanner').classList.remove('show');
  }
  function esc(s) { return String(s == null ? '' : s).replace(/</g, '&lt;'); }
  function initials(name) {
    if (!name) return '?';
    const words = name.replace(/[()[\]]/g, '').split(/\s+/).filter(Boolean);
    if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
    return (words[0][0] + words[1][0]).toUpperCase();
  }
  function avatarColor(name) {
    let hash = 0;
    for (let i = 0; i < (name || '').length; i++) { hash = (hash * 31 + name.charCodeAt(i)) % 360; }
    return `hsl(${hash}, 52%, 40%)`;
  }
  function clientAvatarHtml(name) {
    const safe = (name || '').replace(/"/g, '&quot;');
    return `<img class="client-avatar client-logo" src="/api/logo?client=${encodeURIComponent(name || '')}" alt="${safe}"
      onerror="this.outerHTML='<div class=&quot;client-avatar&quot; style=&quot;background:${avatarColor(name)}&quot;>${initials(name)}</div>'">`;
  }

  // ---------------------------------------------------------------
  // Chargement résilient de Chart.js (comme rm-collecte.html / mission.html)
  // ---------------------------------------------------------------
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src; s.onload = resolve; s.onerror = reject;
      document.head.appendChild(s);
    });
  }
  async function ensureChartJs() {
    if (window.Chart) return true;
    const urls = [
      'https://cdnjs.cloudflare.com/ajax/libs/chart.js/4.4.4/chart.umd.min.js',
      'https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js',
    ];
    for (const url of urls) {
      try { await loadScript(url); if (window.Chart) return true; } catch (e) { /* essaie le suivant */ }
    }
    return false;
  }

  // ---------------------------------------------------------------
  // Synchro / cache : même logique que /rm.html — auto-refresh toutes
  // les 5 min, pastille live/offline, et en cas d'échec réseau on garde
  // affichées les dernières données chargées avec succès (pas d'UI vide).
  // ---------------------------------------------------------------
  let lastSync = null;
  let liveMode = false;
  function renderSyncLabel() {
    if (lastSync) {
      document.getElementById('syncTime').textContent = lastSync.toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    }
    document.getElementById('liveDiamond').classList.toggle('off', !liveMode);
  }
  const REFRESH_MS = 5 * 60 * 1000;
  let remaining = REFRESH_MS;
  function tickCountdown(id) {
    remaining -= 1000;
    if (remaining <= 0) { remaining = REFRESH_MS; loadFiche(id); return; }
    const s = Math.floor(remaining / 1000);
    const mm = Math.floor(s / 60), ss = s % 60;
    document.getElementById('countdown').textContent = `${mm}:${ss.toString().padStart(2, '0')}`;
    document.getElementById('refreshFill').style.width = (100 - (remaining / REFRESH_MS) * 100) + '%';
  }

  const qs = new URLSearchParams(window.location.search);
  const idEmplacement = qs.get('id_emplacement');

  let weekdayChart = null, monthChart = null;

  ensureChartJs().then(() => {
    if (idEmplacement) {
      loadFiche(idEmplacement);
      setInterval(() => tickCountdown(idEmplacement), 1000);
    } else {
      showError('Lien invalide : le paramètre id_emplacement est manquant dans l\'URL.');
    }
  });

  async function loadFiche(id) {
    try {
      const res = await fetch('/api/emplacement?id_emplacement=' + encodeURIComponent(id), { cache: 'no-store' });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.message || data.error || 'Erreur inconnue');
      clearError();
      liveMode = true;
      lastSync = new Date();
      renderFiche(id, data);
    } catch (err) {
      liveMode = false;
      showError(err.message);
    }
    renderSyncLabel();
  }

  function renderFiche(id, data) {
    const area = document.getElementById('profileArea');
    area.style.display = 'block';

    const info = data.info || {};
    document.getElementById('subLabel').textContent = [info.adresse, info.code_postal, info.ville]
      .filter(Boolean).join(' · ');

    const missions = data.missions || [];
    const stats = data.globalStats || {};

    area.innerHTML = `
      <div class="profile-card">
        <div class="profile-name">${esc(info.nom || 'Emplacement')}</div>
        <div class="profile-sub">${esc([info.type_emplacement, info.categorie].filter(Boolean).join(' · '))}</div>
      </div>

      <div class="section-label"><span class="diamond"></span>Indicateurs globaux</div>
      <div class="kpi-scroll" id="kpiGlobal"></div>

      <div class="section-label"><span class="diamond"></span>Évolution du taux réel</div>
      <div class="chart-grid">
        <div class="card"><div class="card-inner">
          <div class="chart-title">Par jour de semaine</div>
          <div class="chart-box" id="weekdayChartBox"><canvas id="chart-weekday"></canvas></div>
        </div></div>
        <div class="card"><div class="card-inner">
          <div class="chart-title">Par mois de l'année</div>
          <div class="chart-box" id="monthChartBox"><canvas id="chart-month"></canvas></div>
        </div></div>
      </div>

      <div class="section-label"><span class="diamond"></span>Missions passées ici</div>
      <div id="missionList"></div>
    `;

    renderKpis(stats, missions);
    renderWeekdayChart(data.tauxParJourSemaine || []);
    renderMonthChart(data.tauxParMois || []);
    renderMissions(missions, stats.taux_reel_global);
  }

  function renderKpis(stats, missions) {
    const totalBs = missions.reduce((s, m) => s + (Number(m.bs_reel) || 0), 0);
    const kpis = [
      { v: fmtNum(missions.length), l: 'Missions' },
      { v: stats.nb_jours_total != null ? fmtNum(stats.nb_jours_total) : '—', l: 'Jours' },
      { v: stats.recruteurs_moyen_jour != null ? fmtNum(stats.recruteurs_moyen_jour, 1) : '—', l: 'Recruteurs / jour' },
      { v: fmtNum(totalBs), l: 'BS réel cumulé' },
      { v: stats.taux_reel_global != null ? fmtNum(stats.taux_reel_global, 3) : '—', l: 'Taux réel global' },
      { v: stats.don_moyen_global != null ? fmtEuro(stats.don_moyen_global) : '—', l: 'Don moyen global' },
    ];
    document.getElementById('kpiGlobal').innerHTML = kpis.map((k) => `
      <div class="kpi"><div class="val">${k.v}</div><div class="lbl">${k.l}</div></div>`).join('');
  }

  const WEEKDAY_LABELS = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
  function renderWeekdayChart(rows) {
    if (weekdayChart) { weekdayChart.destroy(); weekdayChart = null; }
    const box = document.getElementById('weekdayChartBox');
    if (typeof Chart === 'undefined') { box.innerHTML = '<div class="chart-empty">Graphique indisponible</div>'; return; }
    if (!rows.length) { box.innerHTML = '<div class="chart-empty">Aucune donnée</div>'; return; }
    if (!box.querySelector('canvas')) box.innerHTML = '<canvas id="chart-weekday"></canvas>';
    const byDay = new Map(rows.map((r) => [Number(r.jour_semaine), r.taux_reel]));
    const data = WEEKDAY_LABELS.map((_, i) => {
      const v = byDay.get(i + 1);
      return v === null || v === undefined ? null : Number(v);
    });
    weekdayChart = new Chart(document.getElementById('chart-weekday'), {
      type: 'bar',
      data: { labels: WEEKDAY_LABELS, datasets: [{ label: 'Taux réel', data, backgroundColor: '#E2173B', borderRadius: 0 }] },
      options: {
        maintainAspectRatio: false,
        scales: {
          y: { beginAtZero: true, ticks: { color: '#75757C', font: { family: 'ui-monospace, monospace', size: 11 }, callback: (v) => fmtNum(v, 2) }, grid: { color: '#E4E4E8' } },
          x: { ticks: { color: '#75757C', font: { family: 'ui-monospace, monospace', size: 10.5 } }, grid: { display: false } },
        },
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: (ctx) => 'Taux réel : ' + fmtNum(ctx.parsed.y, 3) } },
        },
      },
    });
  }

  const MONTH_LABELS = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];
  function renderMonthChart(rows) {
    if (monthChart) { monthChart.destroy(); monthChart = null; }
    const box = document.getElementById('monthChartBox');
    if (typeof Chart === 'undefined') { box.innerHTML = '<div class="chart-empty">Graphique indisponible</div>'; return; }
    if (!rows.length) { box.innerHTML = '<div class="chart-empty">Aucune donnée</div>'; return; }
    if (!box.querySelector('canvas')) box.innerHTML = '<canvas id="chart-month"></canvas>';
    const byMonth = new Map(rows.map((r) => [Number(r.mois), r.taux_reel]));
    const data = MONTH_LABELS.map((_, i) => {
      const v = byMonth.get(i + 1);
      return v === null || v === undefined ? null : Number(v);
    });
    monthChart = new Chart(document.getElementById('chart-month'), {
      type: 'bar',
      data: { labels: MONTH_LABELS.map((m) => m.slice(0, 3)), datasets: [{ label: 'Taux réel', data, backgroundColor: '#0F0F11', borderRadius: 0 }] },
      options: {
        maintainAspectRatio: false,
        scales: {
          y: { beginAtZero: true, ticks: { color: '#75757C', font: { family: 'ui-monospace, monospace', size: 11 }, callback: (v) => fmtNum(v, 2) }, grid: { color: '#E4E4E8' } },
          x: { ticks: { color: '#75757C', font: { family: 'ui-monospace, monospace', size: 10.5 } }, grid: { display: false } },
        },
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { title: (items) => MONTH_LABELS[items[0].dataIndex], label: (ctx) => 'Taux réel : ' + fmtNum(ctx.parsed.y, 3) } },
        },
      },
    });
  }

  function renderMissions(missions, siteTaux) {
    const el = document.getElementById('missionList');
    if (!missions.length) {
      el.innerHTML = '<div class="empty">Aucune mission enregistrée à cet emplacement</div>';
      return;
    }
    el.innerHTML = missions.map((m) => {
      const missionLabel = m.code_mission || m.code_mission_client || 'Mission';
      const sub = [m.client_nom, fmtDate(m.premiere_date) + ' → ' + fmtDate(m.derniere_date), fmtNum(m.nb_jours) + ' j']
        .filter(Boolean).join(' · ');
      const dates = (m.dates_lots || '').split(',').filter(Boolean);
      const compareVal = (siteTaux != null && m.taux_reel != null)
        ? `${fmtNum(siteTaux, 3)} / ${fmtNum(m.taux_reel, 3)}`
        : '—';
      return `
      <div class="mission-card">
        <div class="mission-head">
          ${clientAvatarHtml(m.client_nom)}
          <div class="mission-body">
            <div class="mission-name">${esc(missionLabel)}</div>
            <div class="mission-sub">${esc(sub)}</div>
          </div>
        </div>
        <div class="mission-stats">
          <div class="stat"><div class="stat-val">${m.taux_reel != null ? fmtNum(m.taux_reel, 3) : '—'}</div><div class="stat-lbl">Taux réel</div></div>
          <div class="stat"><div class="stat-val">${compareVal}</div><div class="stat-lbl">Taux réel site / mission</div></div>
          <div class="stat"><div class="stat-val">${m.don_moyen != null ? fmtEuro(m.don_moyen) : '—'}</div><div class="stat-lbl">Don moyen</div></div>
          <div class="stat"><div class="stat-val">${fmtNum(m.bs_reel)}</div><div class="stat-lbl">BS réel</div></div>
        </div>
        ${dates.length ? `
        <div class="dates-label">${dates.length} jour${dates.length > 1 ? 's' : ''} de présence</div>
        <div class="dates-chips">
          ${dates.map((d) => `<span class="date-chip">${esc(fmtDateLong(d))}</span>`).join('')}
        </div>` : ''}
      </div>`;
    }).join('');
  }
})();
</script>

</body>
</html>
