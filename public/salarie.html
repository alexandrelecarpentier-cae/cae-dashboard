<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fiche salarié — Dashboard CAE</title>
<style>
  :root{
    --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F5F6; --line:#E4E4E8;
    --red:#E2173B; --text:#0F0F11; --muted:#75757C;
    --sharp:2px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important; transition-duration:.001ms !important;}}

  header{position:sticky; top:0; z-index:20; background:rgba(255,255,255,.92); backdrop-filter:blur(8px);
    padding:calc(env(safe-area-inset-top) + 14px) 16px 12px; border-bottom:1px solid var(--line);}
  h1{margin:0 0 4px; font-size:20px; font-weight:800; letter-spacing:-.01em; line-height:1.2; text-transform:uppercase;}
  h1 em{color:var(--red); font-style:normal;}
  .sub{font-size:12.5px; color:var(--muted); margin-bottom:2px;}
  .error-banner{margin-top:12px; padding:10px 12px; border:1px solid var(--line); border-left:3px solid var(--red);
    background:#FFF6F7; font-size:12px; color:#7A1225; display:none; line-height:1.5;}
  .error-banner.show{display:block;}
  .error-banner b{color:var(--red);}

  main{padding:4px 16px 40px; max-width:900px; margin:0 auto;}

  /* Écran de recherche */
  .search-box{margin-top:16px;}
  .search-input{width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:var(--sharp);
    font-size:15px; font-family:inherit;}
  .search-results{margin-top:10px; border:1px solid var(--line); border-radius:var(--sharp); overflow:hidden;}
  .search-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px;
    border-bottom:1px solid var(--line); cursor:pointer;}
  .search-row:last-child{border-bottom:none;}
  .search-row:hover{background:var(--surface-2);}
  .search-name{font-weight:700; font-size:14.5px;}
  .search-grade{font-size:11px; color:var(--muted); text-transform:uppercase; font-weight:700;}
  .search-empty{padding:20px 14px; text-align:center; color:var(--muted); font-size:13px;}

  /* Fiche */
  .profile-card{background:#fff; border:1px solid var(--line); border-radius:var(--sharp); padding:18px;
    margin-top:16px;}
  .profile-name{font-size:22px; font-weight:800; text-transform:uppercase; letter-spacing:-.01em;}
  .profile-sub{font-size:13px; color:var(--muted); margin-top:4px;}
  .badge-row{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}
  .badge{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.03em;
    padding:4px 8px; border-radius:var(--sharp); background:var(--surface-2); color:var(--muted);}
  .badge.re{background:#FFF3D6; color:#8A6100;}
  .badge.rm{background:#E2173B; color:#fff;}

  .kpi-grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; margin-top:16px;}
  .kpi{border:1px solid var(--line); border-radius:var(--sharp); padding:12px; background:#fff;}
  .kpi .val{font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:20px; font-weight:800;}
  .kpi .lbl{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin-top:2px;}

  .section-label{display:flex; align-items:center; gap:6px; font-size:10px; text-transform:uppercase;
    letter-spacing:.08em; color:var(--muted); font-weight:700; margin:22px 2px 8px;}
  .section-label .diamond{width:6px; height:6px; background:var(--red); transform:rotate(45deg); flex:0 0 auto;}

  .mission-list{background:#fff; border:1px solid var(--line); border-radius:var(--sharp); overflow:hidden;}
  .mission-row{display:flex; align-items:center; gap:12px; padding:12px 14px; border-bottom:1px solid var(--line);}
  .mission-row:last-child{border-bottom:none;}
  .mission-body{flex:1 1 auto; min-width:0;}
  .mission-name{font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .mission-sub{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .mission-vals{text-align:right; flex:0 0 auto;}
  .mission-vals .taux{font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:15px; font-weight:800;}
  .mission-vals .bs{font-size:10.5px; color:var(--muted); margin-top:1px;}

  .empty{padding:24px 16px; text-align:center; color:var(--muted); font-size:13px;}
</style>
</head>
<body>

<header>
  <h1>Fiche <em>salarié</em></h1>
  <div class="sub" id="subLabel">Recherchez un RD, RE ou RM par nom</div>
  <div class="error-banner" id="errorBanner">
    <b>Connexion impossible.</b> <span id="errorDetail"></span>
  </div>
</header>

<main id="content">
  <div class="search-box" id="searchBox">
    <input class="search-input" id="searchInput" type="text" placeholder="Prénom ou nom…" autocomplete="off">
    <div class="search-results" id="searchResults"></div>
  </div>

  <div id="profileArea" style="display:none;"></div>
</main>

<script>
(function () {
  function fmtNum(n, digits = 0) {
    if (n === null || n === undefined) return '—';
    return Number(n).toLocaleString('fr-FR', { maximumFractionDigits: digits, minimumFractionDigits: digits });
  }
  function fmtDate(d) {
    if (!d) return '—';
    return new Date(d).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }
  function showError(msg) {
    document.getElementById('errorDetail').textContent = msg;
    document.getElementById('errorBanner').classList.add('show');
  }
  function clearError() {
    document.getElementById('errorBanner').classList.remove('show');
  }

  const qs = new URLSearchParams(window.location.search);
  const idUtilisateur = qs.get('id_utilisateur');

  if (idUtilisateur) {
    document.getElementById('searchBox').style.display = 'none';
    loadProfile(idUtilisateur);
  } else {
    setupSearch();
  }

  function setupSearch() {
    const input = document.getElementById('searchInput');
    const results = document.getElementById('searchResults');
    let debounce;
    input.addEventListener('input', () => {
      clearTimeout(debounce);
      const q = input.value.trim();
      if (q.length < 2) { results.innerHTML = ''; return; }
      debounce = setTimeout(() => runSearch(q), 300);
    });

    async function runSearch(q) {
      try {
        const res = await fetch('/api/salarie-recherche?q=' + encodeURIComponent(q), { cache: 'no-store' });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || 'Erreur inconnue');
        clearError();
        renderResults(data.results || []);
      } catch (err) {
        showError(err.message);
      }
    }

    function renderResults(rows) {
      if (!rows.length) {
        results.innerHTML = '<div class="search-empty">Aucun résultat</div>';
        return;
      }
      results.innerHTML = rows.map((r) => {
        const name = [r.prenom, r.nom].filter(Boolean).join(' ') || 'Sans nom';
        return `
        <div class="search-row" data-id="${r.utilisateur_id}">
          <div class="search-name">${name}</div>
          <div class="search-grade">${r.dernier_grade || '—'}</div>
        </div>`;
      }).join('');
      results.querySelectorAll('.search-row').forEach((el) => {
        el.addEventListener('click', () => {
          window.location.search = '?id_utilisateur=' + encodeURIComponent(el.dataset.id);
        });
      });
    }
  }

  function roleLabel(m) {
    if (m.est_rm) return 'RM';
    if (m.est_re) return 'RE';
    return m.grade || '—';
  }

  async function loadProfile(id) {
    try {
      const res = await fetch('/api/salarie?id_utilisateur=' + encodeURIComponent(id), { cache: 'no-store' });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.message || data.error || 'Erreur inconnue');
      clearError();
      renderProfile(data);
    } catch (err) {
      showError(err.message);
    }
  }

  function renderProfile(data) {
    const area = document.getElementById('profileArea');
    area.style.display = 'block';

    const idt = data.identite || {};
    const name = [idt.prenom, idt.nom].filter(Boolean).join(' ') || 'Salarié inconnu';
    document.getElementById('subLabel').textContent = idt.email || '';

    const roles = new Set((data.missions || []).map(roleLabel));
    const badges = [...roles].map((r) => {
      const cls = r === 'RM' ? 'rm' : r === 'RE' ? 're' : '';
      return `<span class="badge ${cls}">${r}</span>`;
    }).join('');

    const resume = data.resume || {};
    const tauxMoyen = resume.heures_rue_total > 0
      ? (resume.bs_reel_total || 0) / resume.heures_rue_total
      : null;

    area.innerHTML = `
      <div class="profile-card">
        <div class="profile-name">${name}</div>
        <div class="profile-sub">${idt.email || ''}${idt.civilite ? ' · ' + idt.civilite : ''}</div>
        <div class="badge-row">${badges}</div>
      </div>

      <div class="kpi-grid">
        <div class="kpi"><div class="val">${resume.nb_missions != null ? fmtNum(resume.nb_missions) : '—'}</div><div class="lbl">Missions</div></div>
        <div class="kpi"><div class="val">${fmtDate(resume.premiere_mission_le)}</div><div class="lbl">Première mission</div></div>
        <div class="kpi"><div class="val">${resume.bs_reel_total != null ? fmtNum(resume.bs_reel_total) : '—'}</div><div class="lbl">BS réel cumulé</div></div>
        <div class="kpi"><div class="val">${tauxMoyen != null ? fmtNum(tauxMoyen, 3) : '—'}</div><div class="lbl">Taux réel moyen</div></div>
      </div>

      <div class="section-label"><span class="diamond"></span>Historique des missions</div>
      <div class="mission-list" id="missionList"></div>
    `;

    const listEl = document.getElementById('missionList');
    const missions = data.missions || [];
    if (!missions.length) {
      listEl.innerHTML = '<div class="empty">Aucune mission enregistrée</div>';
      return;
    }
    listEl.innerHTML = missions.map((m) => {
      const missionLabel = m.code_mission || m.code_mission_client || 'Mission';
      const sub = [m.client_nom, fmtDate(m.date_debut) + ' → ' + fmtDate(m.date_fin), roleLabel(m)]
        .filter(Boolean).join(' · ');
      return `
      <div class="mission-row">
        <div class="mission-body">
          <div class="mission-name">${missionLabel}</div>
          <div class="mission-sub">${sub}</div>
        </div>
        <div class="mission-vals">
          <div class="taux">${m.taux_reel != null ? fmtNum(m.taux_reel, 3) : '—'}</div>
          <div class="bs">${fmtNum(m.bs_reel)} BS réel</div>
        </div>
      </div>`;
    }).join('');
  }
})();
</script>

</body>
</html>
