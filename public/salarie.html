<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fiche salarié — Dashboard CAE</title>
<style>
  :root{
    --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F5F6; --line:#E4E4E8;
    --red:#E2173B; --text:#0F0F11; --muted:#75757C;
    --sharp:2px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important; transition-duration:.001ms !important;}}

  .sync-bar{position:sticky; top:0; z-index:20; background:rgba(255,255,255,.92); backdrop-filter:blur(8px);
    padding:calc(env(safe-area-inset-top) + 10px) 16px 8px; border-bottom:1px solid var(--line);}
  .meta-row{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .sync{font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:11.5px; color:var(--muted); display:flex; align-items:center; gap:6px;}
  .sync b{color:var(--text); font-weight:600;}
  .live-diamond{width:7px; height:7px; background:var(--red); transform:rotate(45deg); flex:0 0 auto; animation:pulse 2.2s infinite;}
  .live-diamond.off{background:#C7C7CC; animation:none;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(226,23,59,.45);}70%{box-shadow:0 0 0 7px rgba(226,23,59,0);}100%{box-shadow:0 0 0 0 rgba(226,23,59,0);}}
  #refreshBar{height:2px; width:100%; background:var(--line); overflow:hidden; margin-top:8px;}
  #refreshFill{height:100%; width:0%; background:var(--red); transition:width 1s linear;}

  .error-banner{margin:16px 16px 0; padding:10px 12px; border:1px solid var(--line); border-left:3px solid var(--red);
    background:#FFF6F7; font-size:12px; color:#7A1225; display:none; line-height:1.5;}
  .error-banner.show{display:block;}
  .error-banner b{color:var(--red);}

  main{padding:16px 16px 40px; max-width:900px; margin:0 auto;}

  /* Fiche */
  .profile-card{background:#fff; border:1px solid var(--line); border-radius:var(--sharp); padding:18px;}
  .profile-name{font-size:22px; font-weight:800; text-transform:uppercase; letter-spacing:-.01em;}
  .profile-sub{font-size:13px; color:var(--muted); margin-top:4px;}
  .badge-row{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}
  .badge{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.03em;
    padding:4px 8px; border-radius:var(--sharp); background:var(--surface-2); color:var(--muted);}
  .badge.re{background:#FFF3D6; color:#8A6100;}
  .badge.rm{background:#E2173B; color:#fff;}

  .kpi-grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; margin-top:16px;}
  @media (min-width:560px){ .kpi-grid{grid-template-columns:repeat(4, 1fr);} }
  .kpi{border:1px solid var(--line); border-radius:var(--sharp); padding:12px; background:#fff;}
  .kpi .val{font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:18px; font-weight:800;}
  .kpi .lbl{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin-top:2px;}

  .section-label{display:flex; align-items:center; gap:6px; font-size:10px; text-transform:uppercase;
    letter-spacing:.08em; color:var(--muted); font-weight:700; margin:22px 2px 8px;}
  .section-label .diamond{width:6px; height:6px; background:var(--red); transform:rotate(45deg); flex:0 0 auto;}

  .table-scroll{background:#fff; border:1px solid var(--line); border-radius:var(--sharp); overflow-x:auto; -webkit-overflow-scrolling:touch;}
  table{width:100%; border-collapse:collapse; font-size:12px; white-space:nowrap;}
  th,td{padding:9px 10px; text-align:left; border-bottom:1px solid var(--line);}
  th{color:var(--muted); font-weight:700; font-size:9.5px; text-transform:uppercase; letter-spacing:.04em;}
  tbody tr:last-child td{border-bottom:none;}
  td.num, th.num{text-align:right; font-family:ui-monospace,SFMono-Regular,Consolas,monospace;}
  td.mission-cell{font-weight:700;}

  .metric-grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:8px; margin-top:10px;}
  @media (min-width:480px){ .metric-grid{grid-template-columns:repeat(3, 1fr);} }
  .metric{background:var(--surface-2); border-radius:var(--sharp); padding:8px 10px;}
  .metric .v{font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:14px; font-weight:800;}
  .metric .l{font-size:9.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin-top:2px;}

  .score-badge{display:inline-block; font-size:10px; font-weight:800; text-transform:uppercase;
    letter-spacing:.02em; padding:2px 7px; border-radius:var(--sharp); margin-left:8px; vertical-align:middle;}
  .score-badge.tresfaible{background:#FFE0E0; color:#A31515;}
  .score-badge.faible{background:#FFE8D1; color:#B3540A;}
  .score-badge.moyen{background:#FFF3D6; color:#8A6100;}
  .score-badge.bon{background:#E1F2E7; color:#1F7A44;}
  .score-badge.tresbon{background:#D6EFFF; color:#0B5FA5;}

  .score-card{background:#fff; border:1px solid var(--line); border-left:2px solid var(--red);
    border-radius:var(--sharp); padding:14px 16px; margin-top:10px; display:flex; align-items:center;
    justify-content:space-between; flex-wrap:wrap; gap:8px;}
  .score-card .score-val{font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:26px; font-weight:800;}
  .score-card .score-lbl{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em;}

  .tip-btn{display:inline-flex; align-items:center; justify-content:center; width:14px; height:14px; margin-left:5px; border-radius:50%;
    border:1px solid var(--muted); color:var(--muted); font-size:9px; font-weight:700; line-height:1; cursor:pointer; background:#fff;
    text-transform:none; vertical-align:middle; padding:0; font-family:inherit;}
  .tip-btn:hover,.tip-btn.active{border-color:var(--red); color:var(--red);}
  #tipPop{display:none; position:absolute; z-index:60; width:270px; max-width:85vw; background:#fff; border:1px solid var(--line);
    border-left:2px solid var(--red); box-shadow:0 4px 14px rgba(0,0,0,.15); padding:8px 10px; font-size:12px; line-height:1.4;
    color:var(--ink,#222); text-transform:none; letter-spacing:0; font-weight:400; text-align:left;}
  .info-wrap{position:relative; display:inline-flex;}
  .info-btn{width:15px; height:15px; border-radius:50%; border:1px solid var(--muted); color:var(--muted);
    background:none; font-size:10px; line-height:13px; text-align:center; padding:0; cursor:pointer;
    font-family:inherit; font-weight:700;}
  .info-btn:hover, .info-btn.active{border-color:var(--red); color:var(--red);}
  .info-panel{display:none; position:absolute; top:20px; left:0; z-index:30; width:260px; max-width:80vw;
    background:#fff; border:1px solid var(--line); border-radius:var(--sharp);
    box-shadow:0 6px 20px rgba(0,0,0,.12); padding:12px 14px; font-weight:400; text-transform:none;
    letter-spacing:normal; font-size:11.5px; line-height:1.5; color:var(--text);}
  .info-panel.show{display:block;}
  .info-panel h4{margin:0 0 4px; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted);}
  .info-panel p{margin:0 0 8px;}
  .info-panel ul{margin:0; padding-left:16px; list-style:none;}
  .info-panel li{display:flex; justify-content:space-between; gap:8px; padding:3px 0; border-top:1px solid var(--line);}
  .info-panel li:first-child{border-top:none;}
  .info-panel li b{white-space:nowrap;}

  .empty{padding:24px 16px; text-align:center; color:var(--muted); font-size:13px;}
</style>
</head>
<body>
<script>
// Mode staging (demande explicite, 10/2026) : si l'URL de la page contient
// ?staging=1, tous les appels fetch('/api/...') de la page reçoivent
// automatiquement le même paramètre, pour que le Worker (index.js)
// interroge la base Metabase Staging (id 4) au lieu de Production (id 3).
// Remplace l'ancien switch cookie + bouton, retiré de toutes les pages.
(function(){
  var isStaging = new URLSearchParams(window.location.search).get('staging') === '1';
  if (!isStaging) return;
  var origFetch = window.fetch;
  window.fetch = function(input, init){
    try {
      var isApiCall = (typeof input === 'string' && input.indexOf('/api/') !== -1)
        || (input && input.url && input.url.indexOf('/api/') !== -1);
      if (isApiCall) {
        var url = typeof input === 'string' ? input : input.url;
        url += (url.indexOf('?') === -1 ? '?' : '&') + 'staging=1';
        input = typeof input === 'string' ? url : new Request(url, input);
      }
    } catch (e) {}
    return origFetch.call(this, input, init);
  };
  document.addEventListener('DOMContentLoaded', function(){
    var b = document.createElement('div');
    b.textContent = '\u25C6 STAGING';
    b.style.cssText = 'position:fixed;bottom:14px;right:14px;z-index:9999;'
      + 'font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;font-weight:700;'
      + 'padding:7px 12px;border-radius:2px;letter-spacing:.03em;pointer-events:none;'
      + 'box-shadow:0 2px 8px rgba(0,0,0,.25);color:#fff;background:#E2173B;';
    document.body.appendChild(b);
  });
})();
</script>


<div class="sync-bar">
  <div class="meta-row">
    <div class="sync"><span class="live-diamond off" id="liveDiamond"></span>Synchro <b id="syncTime">—</b></div>
    <div class="sync" id="countdown">5:00</div>
  </div>
  <div id="refreshBar"><div id="refreshFill"></div></div>
</div>

<div class="error-banner" id="errorBanner">
  <b>Connexion impossible.</b> <span id="errorDetail"></span> La page réessaiera automatiquement.
</div>

<main id="content">
  <div id="profileArea" style="display:none;"></div>
</main>

<script>
(function () {
  function fmtNum(n, digits = 0) {
    if (n === null || n === undefined) return '—';
    return Number(n).toLocaleString('fr-FR', { maximumFractionDigits: digits, minimumFractionDigits: digits });
  }
  function fmtDate(d) {
    if (!d) return '—';
    return new Date(d).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }
  function fmtPct(n, digits = 1) {
    if (n === null || n === undefined) return '—';
    return (Number(n) * 100).toLocaleString('fr-FR', { maximumFractionDigits: digits, minimumFractionDigits: digits }) + ' %';
  }
  // Répartition de genre (cf. NOTE-INDICATEURS.md) : Hommes (monsieur) / Femmes (madame) / Autre-NC,
  // en % de l'ensemble des dons valides ; null si aucun don.
  function genrePcts(h, f, a) {
    const tot = Number(h || 0) + Number(f || 0) + Number(a || 0);
    if (!tot) return null;
    return { h: Number(h || 0) / tot, f: Number(f || 0) / tot, a: Number(a || 0) / tot };
  }
  function genreTxt(h, f, a) {
    const g = genrePcts(h, f, a);
    if (!g) return '—';
    return fmtPct(g.h, 0) + ' H · ' + fmtPct(g.f, 0) + ' F';
  }
  function fmtMoney(n, digits = 2) {
    if (n === null || n === undefined) return '—';
    return Number(n).toLocaleString('fr-FR', { maximumFractionDigits: digits, minimumFractionDigits: digits }) + ' €';
  }
  // Barème v2 (fichier "Score Qualité") : score = don moyen x % de donateurs de + de 25 ans
  // Barème score qualité (0 à 3 Très Faible / 4 à 5,5 Faible / 5,5 à 6,5
  // Moyen / 6,5 à 8 Bon / 8 et plus Très Bon) — identique sur tous les
  // dashboards affichant un score qualité (cf. NOTE-INDICATEURS.md).
  function scoreBareme(score) {
    if (score === null || score === undefined) return null;
    const s = Number(score);
    if (s <= 3) return { label: 'Très faible', cls: 'tresfaible' };
    if (s <= 5.5) return { label: 'Faible', cls: 'faible' };
    if (s <= 6.5) return { label: 'Moyen', cls: 'moyen' };
    if (s <= 8) return { label: 'Bon', cls: 'bon' };
    return { label: 'Très bon', cls: 'tresbon' };
  }
  function scoreBadgeHtml(score) {
    const b = scoreBareme(score);
    if (!b) return '';
    return `<span class="score-badge ${b.cls}">${b.label}</span>`;
  }
  function showError(msg) {
    document.getElementById('errorDetail').textContent = msg;
    document.getElementById('errorBanner').classList.add('show');
  }
  function clearError() {
    document.getElementById('errorBanner').classList.remove('show');
  }

  // ---------------------------------------------------------------
  // Synchro / cache : même logique que /rm.html — auto-refresh toutes
  // les 5 min, pastille live/offline, et en cas d'échec réseau on garde
  // affichées les dernières données chargées avec succès (pas d'UI vide).
  // ---------------------------------------------------------------
  let lastSync = null;
  let liveMode = false;
  function renderSyncLabel() {
    if (lastSync) {
      document.getElementById('syncTime').textContent = lastSync.toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    }
    document.getElementById('liveDiamond').classList.toggle('off', !liveMode);
  }
  const REFRESH_MS = 5 * 60 * 1000;
  let remaining = REFRESH_MS;
  function tickCountdown(id) {
    remaining -= 1000;
    if (remaining <= 0) { remaining = REFRESH_MS; loadProfile(id); return; }
    const s = Math.floor(remaining / 1000);
    const mm = Math.floor(s / 60), ss = s % 60;
    document.getElementById('countdown').textContent = `${mm}:${ss.toString().padStart(2, '0')}`;
    document.getElementById('refreshFill').style.width = (100 - (remaining / REFRESH_MS) * 100) + '%';
  }

  const qs = new URLSearchParams(window.location.search);
  const idUtilisateur = qs.get('id_utilisateur');

  if (idUtilisateur) {
    loadProfile(idUtilisateur);
    setInterval(() => tickCountdown(idUtilisateur), 1000);
  } else {
    showError('Lien invalide : le paramètre id_utilisateur est manquant dans l\'URL.');
  }

  function roleLabel(m) {
    if (m.est_rm) return 'RM';
    if (m.est_re) return 'RE';
    return m.grade || '—';
  }

  async function loadProfile(id) {
    try {
      const res = await fetch('/api/salarie?id_utilisateur=' + encodeURIComponent(id), { cache: 'no-store' });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.message || data.error || 'Erreur inconnue');
      clearError();
      liveMode = true;
      lastSync = new Date();
      renderProfile(data);
    } catch (err) {
      liveMode = false;
      showError(err.message);
    }
    renderSyncLabel();
  }

  function renderProfile(data) {
    const area = document.getElementById('profileArea');
    area.style.display = 'block';

    const idt = data.identite || {};
    const name = [idt.prenom, idt.nom].filter(Boolean).join(' ') || 'Salarié inconnu';

    // Uniquement le statut du dernier contrat (missions déjà triées par
    // date_debut desc côté backend, donc missions[0] = le plus récent).
    const missions = data.missions || [];
    // Rôle de la mission la plus récente pour laquelle un rôle est connu
    // (les missions anciennes migrées n'ont pas toujours de contrat en base).
    const missionAvecRole = missions.find((m) => roleLabel(m) !== '—');
    const dernierRole = missionAvecRole ? roleLabel(missionAvecRole) : null;
    const badgeHtml = dernierRole
      ? (() => {
          const cls = dernierRole === 'RM' ? 'rm' : dernierRole === 'RE' ? 're' : '';
          return `<span class="badge ${cls}">${dernierRole}</span>`;
        })()
      : '';

    const resume = data.resume || {};
    const profil = data.profil || {};
    // Profil de recherche (demande explicite, 10/2026) : statut actif/inactif
    // à la date du jour, ville de résidence, villes de mission (emplacements),
    // permis, nombre de jours depuis le dernier contrat (0 = contrat en cours).
    const actifTxt = profil.actif == null ? '—' : (profil.actif ? 'Actif' : 'Inactif');
    const permisTxt = profil.permis === true ? 'Oui' : profil.permis === false ? 'Non' : 'Non renseigné';
    // Fin du dernier contrat = date de fin du contrat le plus tardif ;
    // « En cours » si un contrat n'est pas terminé (demande explicite, 10/2026).
    const finContratTxt = profil.contrat_en_cours ? 'En cours'
      : (profil.fin_dernier_contrat ? fmtDate(profil.fin_dernier_contrat) : '—');
    const joursTxt = profil.jours_depuis_derniere_mission == null ? '—'
      : (Number(profil.jours_depuis_derniere_mission) === 0 ? 'Aujourd\'hui' : fmtNum(profil.jours_depuis_derniere_mission) + ' j');
    const escTxt = (t) => String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
    const txtVal = (v) => `<div class="val" style="font-size:14px;line-height:1.3;">${escTxt(v || '—')}</div>`;

    area.innerHTML = `
      <div class="profile-card">
        <div class="profile-name">${name}</div>
        <div class="profile-sub">${idt.email || ''}</div>
        <div class="badge-row">${badgeHtml}</div>
      </div>

      <div class="kpi-grid">
        <div class="kpi"><div class="val">${actifTxt}</div><div class="lbl" data-tip="Actif = au moins un lot à venir (aujourd'hui compris) sur une mission en cours, ou un contrat non terminé ; sinon Inactif.">Statut à ce jour</div></div>
        <div class="kpi"><div class="val">${permisTxt}</div><div class="lbl" data-tip="utilisateur_situations.permis_de_conduire (Oui / Non / Non renseigné).">Permis</div></div>
        <div class="kpi"><div class="val">${joursTxt}</div><div class="lbl" data-tip="Aujourd'hui − date du dernier lot passé (lots.date ≤ aujourd'hui) ; « Aujourd'hui » si 0 ; « — » si aucun lot.">Depuis la dernière mission</div></div>
        <div class="kpi">${txtVal(profil.ville_residence)}<div class="lbl" data-tip="utilisateur_informations_contact.ville.">Ville de résidence</div></div>
        <div class="kpi" style="grid-column:1 / -1;">${txtVal(profil.villes_mission)}<div class="lbl" data-tip="Villes principales (missions.ville_principale) des missions du salarié (contrat ou lot), dédoublonnées sans tenir compte de la casse.">Villes de mission</div></div>
        <div class="kpi"><div class="val">${resume.nb_missions != null ? fmtNum(resume.nb_missions) : '—'}</div><div class="lbl" data-tip="Nombre de missions distinctes avec un contrat ou au moins un lot du salarié (clients exclus non comptés).">Missions</div></div>
        <div class="kpi"><div class="val">${fmtDate(resume.premiere_mission_le)}</div><div class="lbl" data-tip="Date de début la plus ancienne parmi les missions du salarié.">Première mission</div></div>
        <div class="kpi"><div class="val">${finContratTxt}</div><div class="lbl" data-tip="max(contrats.date_fin) ; « En cours » si un contrat n'est pas terminé.">Fin du dernier contrat</div></div>
        <div class="kpi"><div class="val">${resume.bs_reel_total != null ? fmtNum(resume.bs_reel_total) : '—'}</div><div class="lbl" data-tip="count(distinct dons) au statut nouveau / en_attente / transmis, sur les lots du salarié jusqu'à aujourd'hui.">BS réel cumulé</div></div>
        <div class="kpi"><div class="val">${resume.age_median_total != null ? fmtNum(resume.age_median_total, 1) + ' ans' : '—'}</div><div class="lbl" data-tip="percentile_cont(0,5) de l'âge des donateurs (date du don − date de naissance) / 365,25, dons valides du salarié (1 décimale). Dons sans date de naissance exclus.">Âge médian</div></div>
        <div class="kpi"><div class="val" style="font-size:14px;line-height:1.3;">${genreTxt(resume.nb_hommes_total, resume.nb_femmes_total, resume.nb_autre_genre_total)}</div><div class="lbl" data-tip="Répartition des dons valides par civilité du donateur : Hommes (monsieur) / Femmes (madame) ; le reste (Autre/NC)${genrePcts(resume.nb_hommes_total, resume.nb_femmes_total, resume.nb_autre_genre_total) ? ' = ' + fmtPct(genrePcts(resume.nb_hommes_total, resume.nb_femmes_total, resume.nb_autre_genre_total).a, 0) + ' ici' : ''}. % de l'ensemble des dons valides.">Répartition H / F</div></div>
        <div class="kpi"><div class="val">${resume.heures_rue_total != null ? fmtNum(resume.heures_rue_total, 1) : '—'}</div><div class="lbl" data-tip="Σ nombre_horaires_rue des lots avec presence_recruteur ≠ faux (lots ≤ aujourd'hui ; heures rémunérées non complétées ignorées le jour même).">Heures de rue totales</div></div>
        <div class="kpi"><div class="val">${resume.heures_remuneration_total != null ? fmtNum(resume.heures_remuneration_total, 1) : '—'}</div><div class="lbl" data-tip="Σ nombre_horaires_remuneration des lots présents (heures rémunérées ≠ 0).">Heures rémunérées totales</div></div>
        <div class="kpi"><div class="val">${fmtPct(resume.ratio_h_total)}</div><div class="lbl" data-tip="Heures de rue / heures rémunérées (affiché en %).">Ratio h rue/rém</div></div>
      </div>

      <div class="section-label"><span class="diamond"></span>Historique des missions</div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Mission</th><th>Client</th><th data-tip="Grade du contrat le plus récent sur la mission (RD, RDC, RDE…) ; RE / RM si la personne est responsable d'équipe / de mission.">Rôle</th><th>Format</th><th data-tip="Responsable d'équipe de la mission.">RE</th><th data-tip="Responsable de mission.">RM</th>
              <th>Début</th><th>Fin</th>
              <th data-tip="count(distinct dons) au statut nouveau / en_attente / transmis sur les lots du salarié pour cette mission." class="num">BS réel</th><th data-tip="BS réel / heures de rue (lots avec presence_recruteur ≠ faux)." class="num">Taux réel</th>
              <th data-tip="Heures de rue / heures rémunérées (en %)." class="num">Ratio h</th>
              <th data-tip="avg(montant) des dons valides." class="num">Don moyen</th><th data-tip="percentile_cont(0,5) de l'âge des donateurs à la date du don (dons valides avec date de naissance connue), 1 décimale." class="num">Âge médian</th><th data-tip="Dons valides par civilité du donateur : Hommes (monsieur) / Femmes (madame) ; Autre/NC compté au dénominateur." class="num">H / F</th><th data-tip="100 × dons valides avec donateur < 25 ans (âge à la date du don) / dons valides dont la date de naissance est connue." class="num">−25 ans</th>
              <th data-tip="Don moyen × (1 − % donateurs −25 ans). Barème : 0–3 Très faible · 3–5,5 Faible · 5,5–6,5 Moyen · 6,5–8 Bon · > 8 Très bon.">Score qualité</th>
            </tr>
          </thead>
          <tbody id="missionList"></tbody>
        </table>
      </div>
    `;

    // Infobulles cliquables : un petit « i » à côté de chaque libellé portant data-tip.
    (function initTips() {
      let pop = document.getElementById('tipPop');
      if (!pop) { pop = document.createElement('div'); pop.id = 'tipPop'; document.body.appendChild(pop); }
      let current = null;
      const hide = () => { pop.style.display = 'none'; if (current) current.classList.remove('active'); current = null; };
      document.querySelectorAll('#profileArea [data-tip]').forEach((el) => {
        if (el.querySelector('.tip-btn')) return;
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'tip-btn'; b.textContent = 'i';
        b.setAttribute('aria-label', 'Formule');
        b.addEventListener('click', (e) => {
          e.stopPropagation();
          if (current === b) { hide(); return; }
          hide();
          pop.textContent = el.getAttribute('data-tip');
          pop.style.display = 'block';
          const r = b.getBoundingClientRect();
          const w = pop.offsetWidth;
          let left = r.left + window.scrollX - 10;
          left = Math.max(8, Math.min(left, window.scrollX + document.documentElement.clientWidth - w - 8));
          pop.style.left = left + 'px';
          pop.style.top = (r.bottom + window.scrollY + 6) + 'px';
          b.classList.add('active'); current = b;
        });
        el.appendChild(b);
      });
      if (!window.__tipBound) {
        window.__tipBound = true;
        document.addEventListener('click', (e) => { if (!pop.contains(e.target)) hide(); });
      }
    })();

    const listEl = document.getElementById('missionList');
    if (!missions.length) {
      listEl.innerHTML = '<tr><td colspan="16" class="empty">Aucune mission enregistrée</td></tr>';
      return;
    }
    const formatLabel = (f) => ({ street: 'Street', sitesprives: 'Site privé', hybride: 'Hybride' }[f] || f || '—');
    listEl.innerHTML = missions.map((m) => {
      const missionLabel = m.code_mission || m.code_mission_client || 'Mission';
      return `
      <tr>
        <td class="mission-cell">${missionLabel}</td>
        <td>${m.client_nom || '—'}</td>
        <td>${roleLabel(m)}</td>
        <td>${formatLabel(m.format)}</td>
        <td>${m.re || '—'}</td>
        <td>${m.rm || '—'}</td>
        <td>${fmtDate(m.date_debut)}</td>
        <td>${fmtDate(m.date_fin)}</td>
        <td class="num">${fmtNum(m.bs_reel)}</td>
        <td class="num">${m.taux_reel != null ? fmtNum(m.taux_reel, 3) : '—'}</td>
        <td class="num">${fmtPct(m.ratio_h)}</td>
        <td class="num">${m.don_moyen != null ? fmtMoney(m.don_moyen) : '—'}</td>
        <td class="num">${m.age_median != null ? fmtNum(m.age_median, 1) + ' ans' : '—'}</td>
        <td class="num">${genreTxt(m.nb_hommes, m.nb_femmes, m.nb_autre_genre)}</td>
        <td class="num">${m.pct_moins_25 != null ? fmtPct(m.pct_moins_25) : '—'}</td>
        <td>${m.score_qualite != null ? fmtNum(m.score_qualite, 2) : '—'}${scoreBadgeHtml(m.score_qualite)}</td>
      </tr>`;
    }).join('');
  }
})();
</script>
