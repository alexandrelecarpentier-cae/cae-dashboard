<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fiche salarié — Dashboard CAE</title>
<style>
  :root{
    --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F5F6; --line:#E4E4E8;
    --red:#E2173B; --text:#0F0F11; --muted:#75757C;
    --sharp:2px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important; transition-duration:.001ms !important;}}

  .error-banner{margin:16px 16px 0; padding:10px 12px; border:1px solid var(--line); border-left:3px solid var(--red);
    background:#FFF6F7; font-size:12px; color:#7A1225; display:none; line-height:1.5;}
  .error-banner.show{display:block;}
  .error-banner b{color:var(--red);}

  main{padding:16px 16px 40px; max-width:900px; margin:0 auto;}

  /* Fiche */
  .profile-card{background:#fff; border:1px solid var(--line); border-radius:var(--sharp); padding:18px;}
  .profile-name{font-size:22px; font-weight:800; text-transform:uppercase; letter-spacing:-.01em;}
  .profile-sub{font-size:13px; color:var(--muted); margin-top:4px;}
  .badge-row{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}
  .badge{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.03em;
    padding:4px 8px; border-radius:var(--sharp); background:var(--surface-2); color:var(--muted);}
  .badge.re{background:#FFF3D6; color:#8A6100;}
  .badge.rm{background:#E2173B; color:#fff;}

  .kpi-grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; margin-top:16px;}
  @media (min-width:560px){ .kpi-grid{grid-template-columns:repeat(4, 1fr);} }
  .kpi{border:1px solid var(--line); border-radius:var(--sharp); padding:12px; background:#fff;}
  .kpi .val{font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:18px; font-weight:800;}
  .kpi .lbl{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin-top:2px;}

  .section-label{display:flex; align-items:center; gap:6px; font-size:10px; text-transform:uppercase;
    letter-spacing:.08em; color:var(--muted); font-weight:700; margin:22px 2px 8px;}
  .section-label .diamond{width:6px; height:6px; background:var(--red); transform:rotate(45deg); flex:0 0 auto;}

  .mission-list{background:#fff; border:1px solid var(--line); border-radius:var(--sharp); overflow:hidden;}
  .mission-row{padding:14px; border-bottom:1px solid var(--line);}
  .mission-row:last-child{border-bottom:none;}
  .mission-header{display:flex; align-items:center; gap:12px;}
  .mission-body{flex:1 1 auto; min-width:0;}
  .mission-name{font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .mission-sub{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .mission-vals{text-align:right; flex:0 0 auto;}
  .mission-vals .taux{font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:15px; font-weight:800;}
  .mission-vals .bs{font-size:10.5px; color:var(--muted); margin-top:1px;}

  .metric-grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:8px; margin-top:10px;}
  @media (min-width:480px){ .metric-grid{grid-template-columns:repeat(3, 1fr);} }
  .metric{background:var(--surface-2); border-radius:var(--sharp); padding:8px 10px;}
  .metric .v{font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:14px; font-weight:800;}
  .metric .l{font-size:9.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin-top:2px;}

  .score-badge{display:inline-block; font-size:10px; font-weight:800; text-transform:uppercase;
    letter-spacing:.02em; padding:2px 7px; border-radius:var(--sharp); margin-left:8px; vertical-align:middle;}
  .score-badge.alerte{background:#FFE0E0; color:#A31515;}
  .score-badge.moyen{background:#FFF3D6; color:#8A6100;}
  .score-badge.fiable{background:#E1F2E7; color:#1F7A44;}
  .score-badge.tres-fiable{background:#D6EFFF; color:#0B5FA5;}

  .score-card{background:#fff; border:1px solid var(--line); border-left:2px solid var(--red);
    border-radius:var(--sharp); padding:14px 16px; margin-top:10px; display:flex; align-items:center;
    justify-content:space-between; flex-wrap:wrap; gap:8px;}
  .score-card .score-val{font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:26px; font-weight:800;}
  .score-card .score-lbl{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em;}

  .info-wrap{position:relative; display:inline-flex;}
  .info-btn{width:15px; height:15px; border-radius:50%; border:1px solid var(--muted); color:var(--muted);
    background:none; font-size:10px; line-height:13px; text-align:center; padding:0; cursor:pointer;
    font-family:inherit; font-weight:700;}
  .info-btn:hover, .info-btn.active{border-color:var(--red); color:var(--red);}
  .info-panel{display:none; position:absolute; top:20px; left:0; z-index:30; width:260px; max-width:80vw;
    background:#fff; border:1px solid var(--line); border-radius:var(--sharp);
    box-shadow:0 6px 20px rgba(0,0,0,.12); padding:12px 14px; font-weight:400; text-transform:none;
    letter-spacing:normal; font-size:11.5px; line-height:1.5; color:var(--text);}
  .info-panel.show{display:block;}
  .info-panel h4{margin:0 0 4px; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted);}
  .info-panel p{margin:0 0 8px;}
  .info-panel ul{margin:0; padding-left:16px; list-style:none;}
  .info-panel li{display:flex; justify-content:space-between; gap:8px; padding:3px 0; border-top:1px solid var(--line);}
  .info-panel li:first-child{border-top:none;}
  .info-panel li b{white-space:nowrap;}

  .empty{padding:24px 16px; text-align:center; color:var(--muted); font-size:13px;}
</style>
</head>
<body>

<div class="error-banner" id="errorBanner">
  <b>Connexion impossible.</b> <span id="errorDetail"></span>
</div>

<main id="content">
  <div id="profileArea" style="display:none;"></div>
</main>

<script>
(function () {
  function fmtNum(n, digits = 0) {
    if (n === null || n === undefined) return '—';
    return Number(n).toLocaleString('fr-FR', { maximumFractionDigits: digits, minimumFractionDigits: digits });
  }
  function fmtDate(d) {
    if (!d) return '—';
    return new Date(d).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }
  function fmtPct(n, digits = 1) {
    if (n === null || n === undefined) return '—';
    return (Number(n) * 100).toLocaleString('fr-FR', { maximumFractionDigits: digits, minimumFractionDigits: digits }) + ' %';
  }
  function fmtMoney(n, digits = 2) {
    if (n === null || n === undefined) return '—';
    return Number(n).toLocaleString('fr-FR', { maximumFractionDigits: digits, minimumFractionDigits: digits }) + ' €';
  }
  // Barème v2 (fichier "Score Qualité") : score = don moyen x % de donateurs de + de 25 ans
  function scoreBareme(score) {
    if (score === null || score === undefined) return null;
    const s = Number(score);
    if (s < 4) return { label: 'Alerte', desc: 'Pas fiable', cls: 'alerte' };
    if (s < 5.5) return { label: 'RD-RDC', desc: 'Fiable moyen', cls: 'moyen' };
    if (s < 6.5) return { label: 'RDC+', desc: 'Fiable', cls: 'fiable' };
    return { label: 'RDE', desc: 'Très fiable', cls: 'tres-fiable' };
  }
  function scoreBadgeHtml(score) {
    const b = scoreBareme(score);
    if (!b) return '';
    return `<span class="score-badge ${b.cls}">${b.label} · ${b.desc}</span>`;
  }
  function showError(msg) {
    document.getElementById('errorDetail').textContent = msg;
    document.getElementById('errorBanner').classList.add('show');
  }
  function clearError() {
    document.getElementById('errorBanner').classList.remove('show');
  }

  const qs = new URLSearchParams(window.location.search);
  const idUtilisateur = qs.get('id_utilisateur');

  if (idUtilisateur) {
    loadProfile(idUtilisateur);
  } else {
    showError('Lien invalide : le paramètre id_utilisateur est manquant dans l\'URL.');
  }

  function roleLabel(m) {
    if (m.est_rm) return 'RM';
    if (m.est_re) return 'RE';
    return m.grade || '—';
  }

  async function loadProfile(id) {
    try {
      const res = await fetch('/api/salarie?id_utilisateur=' + encodeURIComponent(id), { cache: 'no-store' });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.message || data.error || 'Erreur inconnue');
      clearError();
      renderProfile(data);
    } catch (err) {
      showError(err.message);
    }
  }

  function renderProfile(data) {
    const area = document.getElementById('profileArea');
    area.style.display = 'block';

    const idt = data.identite || {};
    const name = [idt.prenom, idt.nom].filter(Boolean).join(' ') || 'Salarié inconnu';

    // Uniquement le statut du dernier contrat (missions déjà triées par
    // date_debut desc côté backend, donc missions[0] = le plus récent).
    const missions = data.missions || [];
    const dernierRole = missions.length ? roleLabel(missions[0]) : null;
    const badgeHtml = dernierRole
      ? (() => {
          const cls = dernierRole === 'RM' ? 'rm' : dernierRole === 'RE' ? 're' : '';
          return `<span class="badge ${cls}">${dernierRole}</span>`;
        })()
      : '';

    const resume = data.resume || {};
    const statut = data.statutGlobal || {};

    area.innerHTML = `
      <div class="profile-card">
        <div class="profile-name">${name}</div>
        <div class="profile-sub">${idt.email || ''}${idt.civilite ? ' · ' + idt.civilite : ''}</div>
        <div class="badge-row">${badgeHtml}</div>
      </div>

      <div class="kpi-grid">
        <div class="kpi"><div class="val">${resume.nb_missions != null ? fmtNum(resume.nb_missions) : '—'}</div><div class="lbl">Missions</div></div>
        <div class="kpi"><div class="val">${fmtDate(resume.premiere_mission_le)}</div><div class="lbl">Première mission</div></div>
        <div class="kpi"><div class="val">${fmtDate(resume.derniere_mission_le)}</div><div class="lbl">Dernière mission</div></div>
        <div class="kpi"><div class="val">${resume.bs_reel_total != null ? fmtNum(resume.bs_reel_total) : '—'}</div><div class="lbl">BS réel cumulé</div></div>
        <div class="kpi"><div class="val">${resume.heures_rue_total != null ? fmtNum(resume.heures_rue_total, 1) : '—'}</div><div class="lbl">Heures de rue totales</div></div>
        <div class="kpi"><div class="val">${resume.heures_remuneration_total != null ? fmtNum(resume.heures_remuneration_total, 1) : '—'}</div><div class="lbl">Heures rémunérées totales</div></div>
        <div class="kpi"><div class="val">${resume.taux_h_total != null ? fmtNum(resume.taux_h_total, 3) : '—'}</div><div class="lbl">Taux heures rue / rémunérées</div></div>
        <div class="kpi"><div class="val">${resume.taux_absence_total != null ? fmtPct(resume.taux_absence_total) : '—'}</div><div class="lbl">Taux d'absence</div></div>
      </div>

      <div class="section-label">
        <span class="diamond"></span>Statut global — 270 dernières heures rémunérées
        <span class="info-wrap">
          <button type="button" class="info-btn" id="statutInfoBtn" aria-label="Règles de calcul">i</button>
          <div class="info-panel" id="statutInfoPanel">
            <h4>Calcul</h4>
            <p>Sur les lots des 270 dernières heures rémunérées <b>déclarées</b> (heures non déclarées exclues) :<br>
            Score qualité = Don moyen × % de donateurs de plus de 25 ans (âge calculé à la date du don).</p>
            <h4>Barème</h4>
            <ul>
              <li><span>Score &lt; 4</span><b>Alerte · Pas fiable</b></li>
              <li><span>4 ≤ Score &lt; 5,5</span><b>RD-RDC · Fiable moyen</b></li>
              <li><span>5,5 ≤ Score &lt; 6,5</span><b>RDC+ · Fiable</b></li>
              <li><span>Score ≥ 6,5</span><b>RDE · Très fiable</b></li>
            </ul>
          </div>
        </span>
      </div>
      <div class="score-card">
        <div>
          <div class="score-val">${statut.score_qualite_270 != null ? fmtNum(statut.score_qualite_270, 2) : '—'}</div>
          <div class="score-lbl">Don moyen × % donateurs +25 ans</div>
        </div>
        <div>${scoreBadgeHtml(statut.score_qualite_270)}</div>
      </div>
      <div class="metric-grid">
        <div class="metric"><div class="v">${statut.don_moyen_270 != null ? fmtMoney(statut.don_moyen_270) : '—'}</div><div class="l">Don moyen</div></div>
        <div class="metric"><div class="v">${statut.pct_plus_25_270 != null ? fmtPct(statut.pct_plus_25_270) : '—'}</div><div class="l">Donateurs +25 ans</div></div>
        <div class="metric"><div class="v">${statut.bs_reel_270 != null ? fmtNum(statut.bs_reel_270) : '—'}</div><div class="l">BS réel (270h)</div></div>
        <div class="metric"><div class="v">${statut.heures_remuneration_270 != null ? fmtNum(statut.heures_remuneration_270, 1) : '—'}</div><div class="l">Heures rémunérées évaluées</div></div>
      </div>

      <div class="section-label"><span class="diamond"></span>Historique des missions</div>
      <div class="mission-list" id="missionList"></div>
    `;

    const infoBtn = document.getElementById('statutInfoBtn');
    const infoPanel = document.getElementById('statutInfoPanel');
    if (infoBtn && infoPanel) {
      infoBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        infoPanel.classList.toggle('show');
        infoBtn.classList.toggle('active');
      });
      document.addEventListener('click', (e) => {
        if (!infoPanel.contains(e.target) && e.target !== infoBtn) {
          infoPanel.classList.remove('show');
          infoBtn.classList.remove('active');
        }
      });
    }

    const listEl = document.getElementById('missionList');
    if (!missions.length) {
      listEl.innerHTML = '<div class="empty">Aucune mission enregistrée</div>';
      return;
    }
    listEl.innerHTML = missions.map((m) => {
      const missionLabel = m.code_mission || m.code_mission_client || 'Mission';
      const sub = [m.client_nom, fmtDate(m.date_debut) + ' → ' + fmtDate(m.date_fin), roleLabel(m)]
        .filter(Boolean).join(' · ');
      return `
      <div class="mission-row">
        <div class="mission-header">
          <div class="mission-body">
            <div class="mission-name">${missionLabel}${scoreBadgeHtml(m.score_qualite)}</div>
            <div class="mission-sub">${sub}</div>
          </div>
          <div class="mission-vals">
            <div class="taux">${m.taux_reel != null ? fmtNum(m.taux_reel, 3) : '—'}</div>
            <div class="bs">${fmtNum(m.bs_reel)} BS réel</div>
          </div>
        </div>
        <div class="metric-grid">
          <div class="metric"><div class="v">${m.taux_h != null ? fmtNum(m.taux_h, 3) : '—'}</div><div class="l">Taux heures rue / rémunérées</div></div>
          <div class="metric"><div class="v">${m.taux_absence != null ? fmtPct(m.taux_absence) : '—'}</div><div class="l">Taux d'absence</div></div>
          <div class="metric"><div class="v">${m.don_moyen != null ? fmtMoney(m.don_moyen) : '—'}</div><div class="l">Don moyen</div></div>
          <div class="metric"><div class="v">${m.pct_plus_25 != null ? fmtPct(m.pct_plus_25) : '—'}</div><div class="l">Donateurs +25 ans</div></div>
          <div class="metric"><div class="v">${m.score_qualite != null ? fmtNum(m.score_qualite, 2) : '—'}</div><div class="l">Score qualité</div></div>
        </div>
      </div>`;
    }).join('');
  }
})();
</script>

</body>
</html>
