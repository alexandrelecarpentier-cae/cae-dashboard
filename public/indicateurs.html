e non communiqué ou suspect, email mal orthographié ou faux, adresse de moins de 6 caractères, don saisi entre 20h et 9h ou un dimanche, donateur ayant plus de 5 dons. Sinon le motif est « Ok ». <code>/rd</code> et <code>/re-collecte</code> y ajoutent les dons annulés ; <code>/rm-collecte</code> ignore les dons déjà transmis.", "p": "<code>/rd</code>, <code>/re-collecte</code>, <code>/mission</code>, <code>/rm-collecte</code>", "f": "Un don est suspect dès qu'un des 14 contrôles se déclenche (le premier qui s'applique donne le motif) ; % suspects = dons suspects ÷ dons contrôlés × 100. « Donateur multiple » ne compte qu'au-delà de 5 dons.", "e": "Nantes : 5 dons suspects sur 476 dons contrôlés (valides + annulés) → 1,1 %."}, {"n": "Objectif / % atteint", "d": "L'objectif de dons de la mission est réparti à parts égales sur les jours de travail. Objectif au prorata = objectif × jours déjà réalisés ÷ jours de la mission. % atteint = BS réel ÷ objectif. Sur <code>/rm-collecte</code>, on compare tous les dons depuis le début de la mission à l'objectif.", "p": "<code>/rm-collecte</code>, <code>/re-collecte</code>, <code>/direction</code>", "f": "Objectif au prorata = objectif × jours réalisés ÷ jours de la mission ; % atteint = BS réel ÷ objectif × 100", "e": "Objectif 600 sur 30 jours, 15 jours réalisés → prorata 300 ; 270 dons → 270 ÷ 300 = 90 %."}, {"n": "Taux de FPE", "d": "Part des contrats qui ont un avenant de fin de période d'essai <b>publié</b> (un avenant seulement « signé » n'est pas compté). Sur <code>/rh</code> et <code>/rm-collecte</code>, séparé entre fins à l'initiative de l'employeur et du salarié ; sur <code>/direction</code>, un taux global.", "p": "<code>/rh</code>, <code>/rm-collecte</code>, <code>/direction</code>", "f": "contrats avec un avenant « fin de période d'essai » publié ÷ contrats × 100 (sur /anne : signé ou publié ; distinction initiative employeur / salarié)", "e": "3 contrats avec avenant FPE publié sur 40 contrats → 7,5 %."}, {"n": "Badge FPE / début-fin de contrat", "d": "Le badge « FPE » s'affiche si le contrat le plus récent du recruteur sur la mission comporte un avenant de fin de période d'essai <b>signé ou publié</b> (donc signé ou pas encore signé ; les avenants en erreur d'envoi ne comptent pas) ; les dates affichées sont celles de ce contrat.", "p": "<code>/rd</code>, <code>/re-collecte</code>, <code>/mission</code>, <code>/rh</code>", "f": "Badge affiché si le contrat le plus récent du recruteur sur la mission a un avenant FPE signé ou publié (pas en erreur d'envoi)", "e": "Avenant « signé » mais pas encore publié → badge FPE affiché. Avenant en erreur d'envoi → pas de badge."}, {"n": "Taux de complétion emplacement", "d": "Part des journées de travail pour lesquelles l'emplacement a été renseigné (1 décimale).", "p": "<code>/rh</code>", "f": "lots avec emplacement renseigné ÷ lots × 100. 1 décimale.", "e": "270 lots avec emplacement sur 290 → 93,1 %."}, {"n": "Recrutements / candidatures", "d": "Recrutements : nombre de contrats commençant sur la période. Candidatures : nombre de candidatures reçues dans TeamTailor, sans doublon.", "p": "<code>/rh</code>", "f": "Recrutements = COUNT(contrats dont la date de début est dans la période) · Candidatures = candidatures TeamTailor sans doublon", "e": "12 contrats démarrent en octobre → 12 recrutements."}, {"n": "Délai de complétion d'équipe", "d": "Nombre de jours entre le début de la mission et le début du contrat du dernier recruteur arrivé.", "p": "<code>/rh</code>", "f": "date de début du contrat du dernier recruteur arrivé − date de début de la mission (en jours)", "e": "Mission démarrée le 1er octobre, dernier contrat commencé le 8 octobre → 7 jours."}, {"n": "Anciens / nouveaux, grades", "d": "« Ancien » = a déjà fait au moins 3 missions. Le grade (RD, RDC, RDE) est celui du contrat le plus récent.", "p": "<code>/direction</code>", "f": "Ancien : COUNT(DISTINCT missions) ≥ 3 · nouveau : &lt; 3 · grade (RD, RDC, RDE) = contrat le plus récent", "e": "Un salarié sur 5 missions est ancien ; un salarié sur 2 missions est nouveau."}, {"n": "Horaires 1er / dernier BS", "d": "Heure (heure de Paris) du premier et du dernier don valide de la journée.", "p": "<code>/rm-collecte</code>, <code>/emplacement</code>", "f": "Par jour : heure de Paris du premier et du dernier don valide ; moyenne de ces heures sur les jours du périmètre", "e": "Jour A : 12h00 → 17h30 ; jour B : 13h00 → 16h30 ⇒ 1er BS moyen 12h30, dernier BS moyen 17h00."}, {"n": "Taux réel par jour de semaine / mois", "d": "Taux réel (dons ÷ heures de rue, tous cumulés) calculé pour chaque jour de la semaine (1 = lundi) ou chaque mois.", "p": "<code>/emplacement</code>", "f": "Σ dons valides ÷ Σ heures de rue pour chaque jour de semaine (1 = lundi) ou chaque mois", "e": "Tous les lundis : 60 dons ÷ 150 h = 0,400."}, {"n": "Classement sites / enseignes", "d": "Les sites (ou enseignes) sont classés selon leur taux réel, calculé en cumulant dons et heures. Les sites sans heures sont écartés.", "p": "<code>/site-prive</code>, <code>/assistant-site-prive</code>", "f": "Taux réel du site = Σ dons ÷ Σ heures de rue (cumul sur tous les passages) ; tri décroissant ; sites sans heures écartés", "e": "Site A : 30 dons ÷ 60 h = 0,500 ; site B : 24 dons ÷ 80 h = 0,300 → A est classé avant B."}, {"n": "Top recruteurs / équipes", "d": "Recruteurs classés par nombre de dons (sur le jour, la semaine, la dernière heure) ; équipes classées par taux réel sur la semaine en cours ; uniquement les missions en cours.", "p": "<code>/challenge</code>", "f": "Recruteurs classés par nombre de dons (jour, semaine, dernière heure) ; équipes classées par taux réel de la semaine en cours ; missions en cours uniquement", "e": "Aujourd'hui Julien a 12 dons et Aliou 9 → Julien est premier du jour."}, {"n": "Volume de dons par statut", "d": "Nombre de dons créés sur la période, tous statuts confondus, séparés entre ceux saisis dans CozApp et ceux de l'ancien back-office (BO).", "p": "<code>/direction-suivi</code>", "f": "COUNT(dons) par statut (nouveau, en attente, transmis, incomplet, annulé), séparé CozApp (sans old_cae_id) / ancien back-office", "e": "Nantes : 28 nouveaux, 20 en attente, 412 transmis, 22 incomplets, 16 annulés = 498 dons, tous saisis dans CozApp."}, {"n": "Transmissions / dépôts / facturation", "d": "Transmissions : dons valides créés sur la période, séparés entre « à transmettre » (nouveaux + en attente) et « transmis ». Dépôts : dons dont la date de transmission tombe dans la période. Facturation : dons transmis hors ancien back-office, par client et par type.", "p": "<code>/direction-suivi</code>", "f": "Transmissions : dons valides créés sur la période (« à transmettre » = nouveau + en attente ; « transmis ») · Dépôts : dons dont date_transmission est dans la période · Facturation : dons transmis hors ancien back-office, par client et type", "e": "Nantes : 48 à transmettre (28 + 20), 412 transmis, 412 facturables (type « rue » : 411 ; « site privé » : 1 sur le total des lignes affichées)."}, {"n": "Taux de rencontre", "d": "Part des logements visités où quelqu'un a ouvert la porte, sans compter les logements « non conformes ».", "p": "<code>/re-mobilisation</code>, <code>/rd-mobilisation</code>", "f": "portes ouvertes ÷ (logements visités − logements non conformes) × 100 ; le statut d'un logement est celui de son dernier passage", "e": "3 118 visites, 172 non conformes, 1 818 portes ouvertes → 1 818 ÷ 2 946 = 61,7 %."}, {"n": "Taux de traitement", "d": "Logements visités ÷ nombre de logements de l'habitation.", "p": "<code>/re-mobilisation</code>, <code>/rd-mobilisation</code>", "f": "logements visités ÷ nombre de logements théorique de l'habitation × 100", "e": "3 118 logements visités ÷ 6 243 logements théoriques = 49,9 %."}, {"n": "Nb logements théorique / trouvés", "d": "Théorique : nombre de logements annoncé. Trouvés : nombre de logements réellement comptés sur place.", "p": "<code>/re-mobilisation</code>, <code>/rd-mobilisation</code>", "f": "Théorique = Σ nombre_logements annoncé · Trouvés = Σ logements_count comptés sur place", "e": "6 243 logements annoncés, 3 650 trouvés."}, {"n": "Passages par logement", "d": "Nombre moyen de passages par logement visité ; le statut affiché est celui du dernier passage.", "p": "<code>/re-mobilisation</code>, <code>/rd-mobilisation</code>", "f": "Σ passages ÷ nombre de logements visités", "e": "5 004 passages ÷ 3 118 logements visités = 1,60 passage par logement."}], "regles": ["<b>Don valide</b> : un don dont le statut est « nouveau », « en attente » ou « transmis ». Les dons annulés ou incomplets ne comptent pas. <b>BS au sens large</b> (« BS rue ») : les dons valides + les dons incomplets + les dons annulés.", "<b>Jours pris en compte</b> : uniquement les jours passés ou le jour même, jamais les jours à venir. Si les heures rémunérées d'une journée n'ont pas encore été déclarées, cette journée est ignorée jusqu'au lendemain (le temps que l'équipe les saisisse). Exceptions : <code>/client</code> ignore toute la journée en cours ; <code>/challenge</code> ne retire rien (classement du jour).", "<b>Journée « présente »</b> : une journée où la personne a au moins une heure rémunérée.", "<b>Heures de rue</b> : les heures passées sur le terrain. Quand un recruteur est noté absent, ses heures de rue sont comptées 0 (il reste en base des heures « fantômes » pour ces journées, environ 5 500 h en 2026). Même règle que la question Metabase 486.", "<b>Clients exclus</b> : les clients de test et de démonstration ne sont jamais comptés, sauf sur <code>/rd</code>, <code>/re-collecte</code>, <code>/re-mobilisation</code> et <code>/rd-mobilisation</code>. Les missions de type « mobilisation » sont exclues de tout, sauf de <code>/re-mobilisation</code> et <code>/rd-mobilisation</code> (impossible à filtrer sur <code>/rm</code> et sur les cartes de <code>/rh-suivi</code> et <code>/rh-export</code>).", "<b>Mode staging</b> : ajouter <code>?staging=1</code> à l'adresse d'une page affiche les données de la base de test au lieu de la base réelle. <code>/rm</code> reste toujours sur la base réelle.", "<b>Âge d'un donateur</b> : son âge <b>le jour où il a signé son don</b> (pas son âge d'aujourd'hui). Si sa date de naissance n'est pas connue, il est rangé dans « Autre » pour les tranches d'âge et ignoré dans les pourcentages d'âge. La date de naissance est connue pour presque tous les dons de 2026, mais seulement pour environ 15 % des anciennes missions."], "formats": "Taux réel : 3 décimales · taux de transformation : sans décimale · ratio h, taux de présence, % −25 ans, taux de complétion : en %, 1 décimale · don moyen : en €, 2 décimales · âge médian et âge moyen : 1 décimale · comptages : nombres entiers.", "reserves": ["<code>/site-prive</code> et <code>/assistant-site-prive</code> : ne portent que sur les emplacements privés et les journées sans emplacement. Le « Taux réel mission » (<code>/site-prive</code>) et le récapitulatif « par mission » donnent les chiffres de la mission entière (comme <code>/mission</code>), quel que soit le filtre choisi (emplacement, ville, département). Les autres chiffres, classements et tableaux par site restent limités au filtre. Les journées sans emplacement n'apparaissent que dans les totaux (chiffres clés, récapitulatif mission, enseigne « Autres »), pas dans les tableaux par site ou par jour. <code>/assistant-site-prive</code> n'affiche rien tant qu'aucune mission n'est choisie.", "<code>/emplacement</code> : le « Taux réel mission » de chaque carte mission concerne la mission entière (tous emplacements, comme <code>/mission</code>). Le BS réel, le don moyen et les jours restent ceux de l'emplacement, et le « Taux réel emplacement » de chaque carte ne regarde que cette mission à cet emplacement. Le taux réel global de l'emplacement (toutes missions) est dans les chiffres clés de la fiche.", "<code>/rm-collecte</code> : la liste des RM regroupe les personnes par nom — quelqu'un qui a plusieurs comptes n'apparaît qu'une fois.", "Environ 900 journées en 2026 (surtout en sites privés) sont notées « recruteur absent » mais ont pourtant des heures rémunérées : elles restent comptées comme « présentes » pour le taux de présence.", "<code>/rm</code> reprend la carte Metabase 514 : ses formules (notamment le calcul du « % &lt; 25 ans ») ne peuvent pas être vérifiées depuis ce projet.", "<code>/client</code> ignore la journée en cours, d'où un petit écart de taux réel avec les autres dashboards en cours de journée.", "Les calculs d'âge, de genre et de dons suspects de <code>/rd</code> et <code>/rm-collecte</code> ne tiennent pas encore compte de la règle « heures non déclarées ignorées le jour même » (effet limité à la journée en cours).", "Objectifs par jour : simple approximation, la base ne contient pas d'objectif journalier."], "anne": "<code>/anne</code> reprend <b>tous les indicateurs ci-dessus</b> avec les mêmes formules (on additionne d'abord, on divise ensuite), sur 10 onglets, filtrables et regroupables (2 niveaux max) par : association, mission, ville, jour du lot, LV-MS, RM, statut RD, format, type de mission, RE, catégorie de ville street, année, mois, semaine, index des jours (= jour du mois) / semaines, index jour / semaine de mission, heure du don (+ regroupement année-mois). Choix d'interprétation : <b>LV / MS</b> = mission lundi-vendredi ou mardi-samedi d'après <code>missions.jours</code> ; <b>ville</b> = déduite des 3 dernières lettres du code mission (suffixes SP / HYB ignorés ; sinon ville principale de la mission) ; <b>catégorie de ville</b> = grille Cat. 1 à 4 des questions Metabase « DASHBOARDS ANNE », Paris classé « Hors street » (« Hors grille » pour une ville street absente de la grille, « Hors street » pour les autres formats) ; <b>statut RD</b> = grade du contrat sur la mission (RDE+ = RDE ; RE/RER/RERF/REF = RE) ; index des jours = jour du mois (1 à 31), index des semaines = semaines depuis le lundi 30/12/2024. Limites : l'heure du don n'affecte que les indicateurs basés sur les dons ; l'onglet RH applique les dimensions de temps à la date de début des contrats ; l'onglet Mobilisation ne supporte que les dimensions de mission ; candidatures TeamTailor non disponibles ; tops du challenge remplacés par l'onglet Salariés ; missions et salariés limités à 500 lignes.", "tips": [{"l": "Nb de missions", "t": "Missions différentes ayant au moins une journée de travail"}, {"l": "Nb BS réels", "t": "Dons valides (nouveau, en attente, transmis)"}, {"l": "Nb BS réels / jour", "t": "BS réels ÷ jours d’activité"}, {"l": "Prix BS", "t": "Montant validé ÷ BS réels (€)"}, {"l": "Nb heures contractuelles", "t": "Lots existants × 7 h"}, {"l": "Nb heures payées / rémunérées", "t": "Heures rémunérées"}, {"l": "Nb heures rue", "t": "Heures de rue (0 si recruteur absent)"}, {"l": "Taux réel", "t": "Nb BS ÷ Nb heures rue"}, {"l": "Ratio", "t": "Heures rue ÷ heures rémunérées"}, {"l": "Taux payé", "t": "Nb BS ÷ heures rémunérées"}, {"l": "Taux absence total", "t": "Journées prévues où la personne est absente avec un code d’absence renseigné, sans aucune exclusion"}, {"l": "Nb FPE total", "t": "Part des contrats avec un avenant de fin de période d’essai publié ou signé (basé sur la date de début des contrats)"}, {"l": "Nb RD", "t": "Salariés avec grade RDE"}, {"l": "Nb RE", "t": "Responsables d’équipe"}, {"l": "Volume contractuel", "t": "Objectif de BS de la mission (compté une fois par mission)"}, {"l": "Heures rém.", "t": "Heures rémunérées sur journées présentes"}, {"l": "Ratio h", "t": "Heures de rue ÷ heures rémunérées"}, {"l": "Taux de présence", "t": "Journées présentes ÷ journées prévues (100 % max)"}, {"l": "% absence", "t": "100 % − présence (journées sans heure rémunérée)"}, {"l": "Taux d’absence", "t": "Absences avec code renseigné ÷ journées prévues (codes ignorés écartés)"}, {"l": "Absentéisme", "t": "Absences hors maladie ÷ (présences + absences hors maladie)"}, {"l": "Présence RD", "t": "RD présents ÷ RD attendus"}, {"l": "Recruteurs", "t": "RE compris"}, {"l": "RD", "t": "Hors RE"}, {"l": "Complétion empl.", "t": "Lots avec emplacement renseigné"}, {"l": "1er BS (moy.)", "t": "Heure moyenne du premier don valide du jour (Paris)"}, {"l": "Dernier BS (moy.)", "t": "Heure moyenne du dernier don valide du jour (Paris)"}, {"l": "Âge moyen", "t": "Somme des âges ÷ nb de donateurs avec date de naissance"}, {"l": "% −25 ans", "t": "Part des donateurs de moins de 25 ans au jour du don"}, {"l": "Autre / inconnu", "t": "Âge inconnu ou &lt; 18 ans"}, {"l": "CozApp", "t": "Dons saisis dans CozApp"}, {"l": "Ancien BO", "t": "Dons de l’ancien back-office"}, {"l": "Dépôts", "t": "Dons avec une date de transmission"}, {"l": "Facturables", "t": "Transmis hors ancien BO"}, {"l": "Dons contrôlés", "t": "Dons valides + annulés"}, {"l": "Dons suspects", "t": "Dès qu’un des 14 contrôles se déclenche ; « donateur multiple » seulement au-delà de 5 dons"}, {"l": "Contrats", "t": "Recrutements : contrats commençant sur la période"}, {"l": "FPE", "t": "Contrats avec avenant de fin de période d’essai publié"}, {"l": "Nb FPE total", "t": "Part des contrats avec un avenant de fin de période d’essai publié ou signé"}, {"l": "Volume contractuel", "t": "Objectif de BS de la mission"}]};
var strip = function(s){ return s.replace(/<[^>]+>/g,''); };
var norm = function(s){ return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); };
function render(q){
  var terms = norm(q).split(/\s+/).filter(Boolean);
  var shown = DATA.indicateurs.filter(function(i){
    var hay = norm(i.n+' '+strip(i.d)+' '+strip(i.p)+' '+(i.f||'')+' '+(i.e||''));
    return terms.every(function(t){ return hay.indexOf(t) >= 0; });
  });
  document.getElementById('count').textContent = shown.length + ' indicateur' + (shown.length>1?'s':'') + ' sur ' + DATA.indicateurs.length;
  document.getElementById('list').innerHTML = shown.length ? shown.map(function(i){
    return '<div class="card"><h3>'+i.n+'</h3><p>'+i.d+'</p><div class="where">Où : '+i.p+'</div></div>';
  }).join('') : '<div class="empty">Aucun indicateur ne correspond.</div>';
}
document.getElementById('regles-l').innerHTML = DATA.regles.map(function(r){return '<li>'+r+'</li>';}).join('');
document.getElementById('reserves-l').innerHTML = DATA.reserves.map(function(r){return '<li>'+r+'</li>';}).join('');
document.getElementById('formats-t').innerHTML = DATA.formats;
document.getElementById('anne-t').innerHTML = DATA.anne;
document.getElementById('q').addEventListener('input', function(e){ render(e.target.value); });
function renderTips(q){
  var terms = norm(q).split(/\s+/).filter(Boolean);
  var t = DATA.tips.filter(function(x){ var h = norm(x.l+' '+x.t); return terms.every(function(w){return h.indexOf(w)>=0;}); });
  document.getElementById('tips-t').innerHTML = '<table class="tt">'+t.map(function(x){return '<tr><td>'+x.l+'</td><td>'+x.t+'</td></tr>';}).join('')+'</table>';
}
document.getElementById('q').addEventListener('input', function(e){ renderTips(e.target.value); });
renderTips('');
render('');
</script>
