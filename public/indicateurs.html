<style>
  :root{--bg:#fff;--surface-2:#F5F5F6;--line:#E4E4E8;--red:#E2173B;--text:#0F0F11;--muted:#75757C;--sharp:2px;}
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5;}
  header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;border-bottom:1px solid var(--line);}
  h1{margin:0 0 8px;font-size:21px;font-weight:800;text-transform:uppercase;letter-spacing:-.01em;}
  h1 em{color:var(--red);font-style:normal;}
  input[type=search]{width:100%;max-width:520px;font:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--line);border-radius:var(--sharp);}
  .count{font-size:12px;color:var(--muted);margin-top:6px;}
  main{max-width:980px;margin:0 auto;padding:16px 16px 70px;}
  h2{font-size:14px;text-transform:uppercase;letter-spacing:.05em;margin:28px 0 10px;}
  .card{border:1px solid var(--line);border-left:3px solid var(--red);padding:12px 14px;margin-bottom:10px;}
  .card h3{margin:0 0 4px;font-size:15px;}
  .card p{margin:0 0 8px;font-size:13.5px;}
  .where{font-size:12px;color:var(--muted);}
  .where code{background:var(--surface-2);color:var(--text);}
  code{background:var(--surface-2);padding:1px 5px;border-radius:var(--sharp);font-size:12px;}
  ul{padding-left:18px;margin:0;} li{margin-bottom:8px;font-size:13.5px;}
  .box{background:var(--surface-2);padding:12px 14px;font-size:13.5px;}
  .empty{text-align:center;color:var(--muted);padding:30px;font-size:13px;}
  mark{background:#FFE3E8;}
  nav.toc{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;margin-top:8px;}
  nav.toc a{color:var(--red);text-decoration:none;font-weight:700;}
</style>

var DATA = {"indicateurs": [{"n": "BS réel (= Nb dons)", "d": "Nombre de dons valides.", "p": "tous"}, {"n": "BS rue", "d": "Nombre de dons au sens large (valides + incomplets + annulés).", "p": "<code>/rd</code>, <code>/re-collecte</code>, <code>/mission</code>, <code>/rm-collecte</code>"}, {"n": "Heures de rue", "d": "Total des heures passées sur le terrain (voir règles communes).", "p": "tous sauf <code>/rm</code>"}, {"n": "Heures rémunérées", "d": "Total des heures payées, uniquement sur les journées « présentes ».", "p": "<code>/client</code>, <code>/mission</code>, <code>/rd</code>, <code>/re-collecte</code>, <code>/rm-collecte</code>, <code>/rh</code>, <code>/salarie</code>, <code>/direction</code>, <code>/direction-suivi</code>"}, {"n": "Heures par salarié et par mission", "d": "Heures rémunérées et heures de rue de chaque salarié présent (au moins une heure rémunérée) dans une mission, mêmes règles que ci-dessus. Vue en tableau sur <code>/rm-collecte</code> ; <code>/mission</code> affiche aussi les heures par RD et par journée.", "p": "<code>/rm-collecte</code>, <code>/mission</code>"}, {"n": "Taux réel", "d": "Nombre de dons valides divisé par le nombre d'heures de rue (exemple : 0,250 = 1 don toutes les 4 heures). Affiché avec 3 décimales. Pour un groupe (équipe, mission…), on additionne d'abord tous les dons et toutes les heures, puis on divise — on ne fait pas la moyenne des taux individuels.", "p": "<code>/client</code>, <code>/mission</code>, <code>/rd</code>, <code>/re-collecte</code>, <code>/rm-collecte</code>, <code>/salarie</code>, <code>/rh</code>, <code>/direction</code>, <code>/direction-suivi</code>, <code>/emplacement</code>, <code>/site-prive</code>, <code>/assistant-site-prive</code>, <code>/challenge</code>, <code>/rm</code> (recalculé depuis la carte 514)"}, {"n": "Taux de transformation", "d": "Part des dons valides parmi tous les dons signés : dons valides ÷ dons au sens large × 100. Affiché sans décimale.", "p": "<code>/rd</code>, <code>/re-collecte</code>, <code>/mission</code>, <code>/rm-collecte</code>, <code>/rm</code>"}, {"n": "Don moyen", "d": "Montant moyen des dons valides, en euros, avec 2 décimales.", "p": "tous sauf <code>/challenge</code>, <code>/mobilisation</code>"}, {"n": "Âge médian", "d": "L'âge « du milieu » des donateurs : la moitié des donateurs est plus jeune, l'autre moitié plus âgée. Calculé sur les dons valides dont la date de naissance est connue. Affiché avec 1 décimale.", "p": "<code>/challenge</code> (par mission, à partir de 3 dons), <code>/rd</code>, <code>/re-collecte</code>, <code>/mission</code>, <code>/rm-collecte</code>, <code>/salarie</code> (global et par mission), <code>/direction</code>, <code>/direction-suivi</code>"}, {"n": "Âge moyen", "d": "Âge moyen des donateurs (somme des âges ÷ nombre de donateurs), calculé sur les dons valides dont la date de naissance est connue. Affiché avec 1 décimale. Utilisé à la place de l'âge médian, uniquement sur <code>/client</code>.", "p": "<code>/client</code>"}, {"n": "% donateurs −25 ans", "d": "Part des donateurs qui avaient moins de 25 ans au moment du don, parmi les dons valides dont la date de naissance est connue. Affiché avec 1 décimale.", "p": "<code>/rd</code>, <code>/re-collecte</code>, <code>/mission</code>, <code>/rm-collecte</code>, <code>/salarie</code>, <code>/direction</code>"}, {"n": "Score qualité", "d": "Don moyen × (100 % − part des −25 ans). Plus le don moyen est élevé et plus les donateurs sont âgés de 25 ans ou plus, plus le score monte. Barème : de 0 à 3 = très faible · 3 à 5,5 = faible · 5,5 à 6,5 = moyen · 6,5 à 8 = bon · plus de 8 = très bon. 2 décimales sur <code>/rm-collecte</code> et <code>/salarie</code>, 1 ailleurs.", "p": "<code>/rd</code>, <code>/re-collecte</code>, <code>/mission</code>, <code>/rm-collecte</code>, <code>/salarie</code>"}, {"n": "Ratio h (heures de rue / rémunérées)", "d": "Heures de rue ÷ heures rémunérées, en %. Plus il est proche de 100 %, plus les heures payées ont été passées sur le terrain. Affiché avec 1 décimale.", "p": "<code>/rd</code>, <code>/re-collecte</code>, <code>/mission</code>, <code>/rm-collecte</code>, <code>/salarie</code>, <code>/direction</code>, <code>/direction-suivi</code>"}, {"n": "Taux de présence", "d": "Part des journées prévues où la personne était présente : journées présentes ÷ journées prévues × 100 (100 % maximum).", "p": "<code>/rd</code>, <code>/re-collecte</code>, <code>/mission</code>, <code>/rh</code>"}, {"n": "% absence", "d": "Part des journées prévues sans heure rémunérée (= 100 % − taux de présence).", "p": "<code>/direction-suivi</code>"}, {"n": "Taux d'absence", "d": "Part des journées prévues de la personne où elle est absente <b>avec un code d'absence renseigné</b> et sans heure payée (une journée sans heure payée et sans code n'est pas une absence ; elle reste dans le total des journées prévues). Ne comptent pas comme absences (journées écartées du calcul, y compris du total des journées prévues) : maladie (dont longue durée et professionnelle), accident du travail ou de trajet, temps partiel thérapeutique, maternité, paternité, adoption, congés parental et de présence parentale, événement familial, maladie grave du conjoint, congés payés, repos compensateurs, formation et CIF, activité partielle et chômage partiel, absence rémunérée, congé sans solde, férié chômé non dû, absence non rémunérée autorisée (code 620). Restent comptées : retards sans heure payée, absences non rémunérées « logo » (code 1) ou non autorisées, mise à pied, préavis non effectué.", "p": "<code>/salarie</code> (global et par mission)"}, {"n": "Absentéisme", "d": "1 − (journées de présence hors arrêt maladie ÷ (journées de présence + journées d'absence)). Seules les absences pour maladie ne sont pas comptées comme absences.", "p": "<code>/direction</code>"}, {"n": "Présence des RD (suivi quotidien)", "d": "Chaque jour : RD présents ÷ RD attendus × 100. Les RD attendus sont les recruteurs (hors responsable d'équipe) qui avaient une journée prévue ; ils sont présents s'ils ont des heures rémunérées.", "p": "<code>/rm-collecte</code>"}, {"n": "Nb lots", "d": "Nombre de journées de travail (une journée = un lot) sur la période.", "p": "<code>/direction</code>, <code>/direction-suivi</code>, <code>/rd</code>, <code>/rh</code>"}, {"n": "Nb jours d'activité", "d": "Nombre de dates différentes où il y a eu du travail (par site, emplacement ou mission).", "p": "<code>/site-prive</code>, <code>/assistant-site-prive</code>, <code>/emplacement</code>, <code>/direction</code> (avancement)"}, {"n": "Nb recruteurs", "d": "Nombre de personnes différentes ayant travaillé, responsables d'équipe compris.", "p": "<code>/direction-suivi</code>, <code>/rm-collecte</code>, <code>/rh</code>"}, {"n": "Nb RD", "d": "Nombre de recruteurs différents, sans le responsable d'équipe (RE). Affiché sous la forme « RD+RE » (ex. 3+1). Le grade RD / RDC / RDE vient du contrat le plus récent.", "p": "<code>/site-prive</code>, <code>/assistant-site-prive</code> ; grade sur <code>/direction</code>"}, {"n": "Nb missions", "d": "Nombre de missions différentes ayant au moins une journée de travail sur la période. Sur <code>/client</code> : missions terminées, en cours ou en attente.", "p": "<code>/client</code>, <code>/direction</code>, <code>/direction-suivi</code>, <code>/site-prive</code>"}, {"n": "Villes de mission", "d": "Villes principales des missions du salarié (contrat ou journée de travail), sans doublon même si la casse diffère.", "p": "<code>/salarie</code>"}, {"n": "Tranche d'âge", "d": "Âge du donateur au moment du don, rangé en : 18-20 ans · 21-25 ans · 26-35 ans · 36-50 ans · 51 ans et plus · « Autre » (âge inconnu ou moins de 18 ans).", "p": "<code>/client</code>, <code>/rd</code>, <code>/re-collecte</code>, <code>/mission</code>, <code>/rm-collecte</code>"}, {"n": "Genre", "d": "Civilité du donateur : Hommes (« monsieur »), Femmes (« madame »), Autre/NC (non renseigné ou autre). Sur <code>/salarie</code>, c'est la part de chaque groupe parmi tous les dons valides, affichée « 45 % H · 55 % F » (le reste = Autre/NC), en global et par mission.", "p": "<code>/client</code>, <code>/rd</code>, <code>/re-collecte</code>, <code>/mission</code>, <code>/rm-collecte</code>, <code>/salarie</code>"}, {"n": "Bulletins par jour", "d": "Nombre de dons valides signés chaque jour (et par RD).", "p": "<code>/client</code>, <code>/mission</code>, <code>/rd</code>, <code>/re-collecte</code>, <code>/rm-collecte</code>"}, {"n": "Dons suspects", "d": "Un don est signalé dès qu'il déclenche l'une de ces 14 situations (la première qui s'applique est retenue) : don de test, donateur mineur, nom identique à celui du recruteur, coordonnées identiques à celles du recruteur, coordonnées d'un autre recruteur, montant de 100 € ou plus, pas d'email, téléphone non communiqué ou suspect, email mal orthographié ou faux, adresse de moins de 6 caractères, don saisi entre 20h et 9h ou un dimanche, donateur ayant plus de 5 dons. Sinon le motif est « Ok ». <code>/rd</code> et <code>/re-collecte</code> y ajoutent les dons annulés ; <code>/rm-collecte</code> ignore les dons déjà transmis.", "p": "<code>/rd</code>, <code>/re-collecte</code>, <code>/mission</code>, <code>/rm-collecte</code>"}, {"n": "Objectif / % atteint", "d": "L'objectif de dons de la mission est réparti à parts égales sur les jours de travail. Objectif au prorata = objectif × jours déjà réalisés ÷ jours de la mission. % atteint = BS réel ÷ objectif. Sur <code>/rm-collecte</code>, on compare tous les dons depuis le début de la mission à l'objectif.", "p": "<code>/rm-collecte</code>, <code>/re-collecte</code>, <code>/direction</code>"}, {"n": "Taux de FPE", "d": "Part des contrats qui ont un avenant de fin de période d'essai <b>publié</b> (un avenant seulement « signé » n'est pas compté). Sur <code>/rh</code> et <code>/rm-collecte</code>, séparé entre fins à l'initiative de l'employeur et du salarié ; sur <code>/direction</code>, un taux global.", "p": "<code>/rh</code>, <code>/rm-collecte</code>, <code>/direction</code>"}, {"n": "Badge FPE / début-fin de contrat", "d": "Le badge « FPE » s'affiche si le contrat le plus récent du recruteur sur la mission comporte un avenant de fin de période d'essai <b>signé ou publié</b> (donc signé ou pas encore signé ; les avenants en erreur d'envoi ne comptent pas) ; les dates affichées sont celles de ce contrat.", "p": "<code>/rd</code>, <code>/re-collecte</code>, <code>/mission</code>, <code>/rh</code>"}, {"n": "Taux de complétion emplacement", "d": "Part des journées de travail pour lesquelles l'emplacement a été renseigné (1 décimale).", "p": "<code>/rh</code>"}, {"n": "Recrutements / candidatures", "d": "Recrutements : nombre de contrats commençant sur la période. Candidatures : nombre de candidatures reçues dans TeamTailor, sans doublon.", "p": "<code>/rh</code>"}, {"n": "Délai de complétion d'équipe", "d": "Nombre de jours entre le début de la mission et le début du contrat du dernier recruteur arrivé.", "p": "<code>/rh</code>"}, {"n": "Anciens / nouveaux, grades", "d": "« Ancien » = a déjà fait au moins 3 missions. Le grade (RD, RDC, RDE) est celui du contrat le plus récent.", "p": "<code>/direction</code>"}, {"n": "Horaires 1er / dernier BS", "d": "Heure (heure de Paris) du premier et du dernier don valide de la journée.", "p": "<code>/rm-collecte</code>, <code>/emplacement</code>"}, {"n": "Taux réel par jour de semaine / mois", "d": "Taux réel (dons ÷ heures de rue, tous cumulés) calculé pour chaque jour de la semaine (1 = lundi) ou chaque mois.", "p": "<code>/emplacement</code>"}, {"n": "Classement sites / enseignes", "d": "Les sites (ou enseignes) sont classés selon leur taux réel, calculé en cumulant dons et heures. Les sites sans heures sont écartés.", "p": "<code>/site-prive</code>, <code>/assistant-site-prive</code>"}, {"n": "Top recruteurs / équipes", "d": "Recruteurs classés par nombre de dons (sur le jour, la semaine, la dernière heure) ; équipes classées par taux réel sur la semaine en cours ; uniquement les missions en cours.", "p": "<code>/challenge</code>"}, {"n": "Volume de dons par statut", "d": "Nombre de dons créés sur la période, tous statuts confondus, séparés entre ceux saisis dans CozApp et ceux de l'ancien back-office (BO).", "p": "<code>/direction-suivi</code>"}, {"n": "Transmissions / dépôts / facturation", "d": "Transmissions : dons valides créés sur la période, séparés entre « à transmettre » (nouveaux + en attente) et « transmis ». Dépôts : dons dont la date de transmission tombe dans la période. Facturation : dons transmis hors ancien back-office, par client et par type.", "p": "<code>/direction-suivi</code>"}, {"n": "Taux de rencontre", "d": "Part des logements visités où quelqu'un a ouvert la porte, sans compter les logements « non conformes ».", "p": "<code>/re-mobilisation</code>, <code>/rd-mobilisation</code>"}, {"n": "Taux de traitement", "d": "Logements visités ÷ nombre de logements de l'habitation.", "p": "<code>/re-mobilisation</code>, <code>/rd-mobilisation</code>"}, {"n": "Nb logements théorique / trouvés", "d": "Théorique : nombre de logements annoncé. Trouvés : nombre de logements réellement comptés sur place.", "p": "<code>/re-mobilisation</code>, <code>/rd-mobilisation</code>"}, {"n": "Passages par logement", "d": "Nombre moyen de passages par logement visité ; le statut affiché est celui du dernier passage.", "p": "<code>/re-mobilisation</code>, <code>/rd-mobilisation</code>"}], "regles": ["<b>Don valide</b> : un don dont le statut est « nouveau », « en attente » ou « transmis ». Les dons annulés ou incomplets ne comptent pas. <b>BS au sens large</b> (« BS rue ») : les dons valides + les dons incomplets + les dons annulés.", "<b>Jours pris en compte</b> : uniquement les jours passés ou le jour même, jamais les jours à venir. Si les heures rémunérées d'une journée n'ont pas encore été déclarées, cette journée est ignorée jusqu'au lendemain (le temps que l'équipe les saisisse). Exceptions : <code>/client</code> ignore toute la journée en cours ; <code>/challenge</code> ne retire rien (classement du jour).", "<b>Journée « présente »</b> : une journée où la personne a au moins une heure rémunérée.", "<b>Heures de rue</b> : les heures passées sur le terrain. Quand un recruteur est noté absent, ses heures de rue sont comptées 0 (il reste en base des heures « fantômes » pour ces journées, environ 5 500 h en 2026). Même règle que la question Metabase 486.", "<b>Clients exclus</b> : les clients de test et de démonstration ne sont jamais comptés, sauf sur <code>/rd</code>, <code>/re-collecte</code>, <code>/re-mobilisation</code> et <code>/rd-mobilisation</code>. Les missions de type « mobilisation » sont exclues de tout, sauf de <code>/re-mobilisation</code> et <code>/rd-mobilisation</code> (impossible à filtrer sur <code>/rm</code> et sur les cartes de <code>/rh-suivi</code> et <code>/rh-export</code>).", "<b>Mode staging</b> : ajouter <code>?staging=1</code> à l'adresse d'une page affiche les données de la base de test au lieu de la base réelle. <code>/rm</code> reste toujours sur la base réelle.", "<b>Âge d'un donateur</b> : son âge <b>le jour où il a signé son don</b> (pas son âge d'aujourd'hui). Si sa date de naissance n'est pas connue, il est rangé dans « Autre » pour les tranches d'âge et ignoré dans les pourcentages d'âge. La date de naissance est connue pour presque tous les dons de 2026, mais seulement pour environ 15 % des anciennes missions."], "formats": "Taux réel : 3 décimales · taux de transformation : sans décimale · ratio h, taux de présence, % −25 ans, taux de complétion : en %, 1 décimale · don moyen : en €, 2 décimales · âge médian et âge moyen : 1 décimale · comptages : nombres entiers.", "reserves": ["<code>/site-prive</code> et <code>/assistant-site-prive</code> : ne portent que sur les emplacements privés et les journées sans emplacement. Le « Taux réel mission » (<code>/site-prive</code>) et le récapitulatif « par mission » donnent les chiffres de la mission entière (comme <code>/mission</code>), quel que soit le filtre choisi (emplacement, ville, département). Les autres chiffres, classements et tableaux par site restent limités au filtre. Les journées sans emplacement n'apparaissent que dans les totaux (chiffres clés, récapitulatif mission, enseigne « Autres »), pas dans les tableaux par site ou par jour. <code>/assistant-site-prive</code> n'affiche rien tant qu'aucune mission n'est choisie.", "<code>/emplacement</code> : le « Taux réel mission » de chaque carte mission concerne la mission entière (tous emplacements, comme <code>/mission</code>). Le BS réel, le don moyen et les jours restent ceux de l'emplacement, et le « Taux réel emplacement » de chaque carte ne regarde que cette mission à cet emplacement. Le taux réel global de l'emplacement (toutes missions) est dans les chiffres clés de la fiche.", "<code>/rm-collecte</code> : la liste des RM regroupe les personnes par nom — quelqu'un qui a plusieurs comptes n'apparaît qu'une fois.", "Environ 900 journées en 2026 (surtout en sites privés) sont notées « recruteur absent » mais ont pourtant des heures rémunérées : elles restent comptées comme « présentes » pour le taux de présence.", "<code>/rm</code> reprend la carte Metabase 514 : ses formules (notamment le calcul du « % &lt; 25 ans ») ne peuvent pas être vérifiées depuis ce projet.", "<code>/client</code> ignore la journée en cours, d'où un petit écart de taux réel avec les autres dashboards en cours de journée.", "Les calculs d'âge, de genre et de dons suspects de <code>/rd</code> et <code>/rm-collecte</code> ne tiennent pas encore compte de la règle « heures non déclarées ignorées le jour même » (effet limité à la journée en cours).", "Objectifs par jour : simple approximation, la base ne contient pas d'objectif journalier."], "anne": "<code>/anne</code> reprend <b>tous les indicateurs ci-dessus</b> avec les mêmes formules (on additionne d'abord, on divise ensuite), sur 10 onglets, filtrables et regroupables (2 niveaux max) par : association, mission, ville, jour du lot, LV-MS, RM, statut RD, format, type de mission, RE, catégorie de ville street, année, mois, semaine, index des jours (= jour du mois) / semaines, index jour / semaine de mission, heure du don (+ regroupement année-mois). Choix d'interprétation : <b>LV / MS</b> = mission lundi-vendredi ou mardi-samedi d'après <code>missions.jours</code> ; <b>ville</b> = déduite des 3 dernières lettres du code mission (suffixes SP / HYB ignorés ; sinon ville principale de la mission) ; <b>catégorie de ville</b> = grille Cat. 1 à 4 des questions Metabase « DASHBOARDS ANNE », Paris classé « Hors street » (« Hors grille » pour une ville street absente de la grille, « Hors street » pour les autres formats) ; <b>statut RD</b> = grade du contrat sur la mission (RDE+ = RDE ; RE/RER/RERF/REF = RE) ; index des jours = jour du mois (1 à 31), index des semaines = semaines depuis le lundi 30/12/2024. Limites : l'heure du don n'affecte que les indicateurs basés sur les dons ; l'onglet RH applique les dimensions de temps à la date de début des contrats ; l'onglet Mobilisation ne supporte que les dimensions de mission ; candidatures TeamTailor non disponibles ; tops du challenge remplacés par l'onglet Salariés ; missions et salariés limités à 500 lignes."};
var strip = function(s){ return s.replace(/<[^>]+>/g,''); };
var norm = function(s){ return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); };
function render(q){
  var terms = norm(q).split(/\s+/).filter(Boolean);
  var shown = DATA.indicateurs.filter(function(i){
    var hay = norm(i.n+' '+strip(i.d)+' '+strip(i.p));
    return terms.every(function(t){ return hay.indexOf(t) >= 0; });
  });
  document.getElementById('count').textContent = shown.length + ' indicateur' + (shown.length>1?'s':'') + ' sur ' + DATA.indicateurs.length;
  document.getElementById('list').innerHTML = shown.length ? shown.map(function(i){
    return '<div class="card"><h3>'+i.n+'</h3><p>'+i.d+'</p><div class="where">Où : '+i.p+'</div></div>';
  }).join('') : '<div class="empty">Aucun indicateur ne correspond.</div>';
}
document.getElementById('regles-l').innerHTML = DATA.regles.map(function(r){return '<li>'+r+'</li>';}).join('');
document.getElementById('reserves-l').innerHTML = DATA.reserves.map(function(r){return '<li>'+r+'</li>';}).join('');
document.getElementById('formats-t').innerHTML = DATA.formats;
document.getElementById('anne-t').innerHTML = DATA.anne;
document.getElementById('q').addEventListener('input', function(e){ render(e.target.value); });
render('');
</script>
</body>
</html>
