<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboards CAE</title>
<style>
  :root{
    --bg:#FFFFFF; --text:#0F0F11; --muted:#75757C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    height:100%; display:flex; align-items:center; justify-content:center; text-align:center;}
  .msg{color:var(--muted); font-size:13px; padding:16px;}
</style>
</head>
<body>
<div class="msg">Dashboard CAE</div>
<!-- Mode staging/prod (demande explicite, 9/2026) : bascule la base
     Metabase interrogée par TOUTES les pages, via un cookie lu côté
     serveur (index.js) sur chaque requête /api/*. Widget identique sur
     toutes les pages du projet. -->
<div id="dbModeBadge" onclick="__dbModeToggle()" title="Cliquer pour basculer Production / Staging"></div>
<script>
(function(){
  function dbMode(){
    var m = document.cookie.match(/(?:^|;\s*)dashboard_db_mode=(staging|prod)/);
    return m ? m[1] : 'prod';
  }
  function paint(){
    var mode = dbMode();
    var el = document.getElementById('dbModeBadge');
    if(!el) return;
    el.textContent = mode === 'staging' ? '◆ STAGING' : '◇ PROD';
    el.style.cssText = 'position:fixed;bottom:14px;right:14px;z-index:9999;'
      + 'font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;font-weight:700;'
      + 'padding:7px 12px;border-radius:2px;cursor:pointer;letter-spacing:.03em;'
      + 'box-shadow:0 2px 8px rgba(0,0,0,.25);color:#fff;background:'
      + (mode === 'staging' ? '#E2173B' : '#1A1A1D') + ';';
  }
  window.__dbModeToggle = function(){
    var next = dbMode() === 'staging' ? 'prod' : 'staging';
    document.cookie = 'dashboard_db_mode=' + next + '; path=/; max-age=31536000';
    location.reload();
  };
  paint();
})();
</script>
</body>
</html>
