<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboards CAE</title>
<style>
  :root{
    --bg:#FFFFFF; --text:#0F0F11; --muted:#75757C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    height:100%; display:flex; align-items:center; justify-content:center; text-align:center;}
  .msg{color:var(--muted); font-size:13px; padding:16px;}
</style>
</head>
<body>
<script>
// Mode staging (demande explicite, 10/2026) : si l'URL de la page contient
// ?staging=1, tous les appels fetch('/api/...') de la page reçoivent
// automatiquement le même paramètre, pour que le Worker (index.js)
// interroge la base Metabase Staging (id 4) au lieu de Production (id 3).
// Remplace l'ancien switch cookie + bouton, retiré de toutes les pages.
(function(){
  var isStaging = new URLSearchParams(window.location.search).get('staging') === '1';
  if (!isStaging) return;
  var origFetch = window.fetch;
  window.fetch = function(input, init){
    try {
      var isApiCall = (typeof input === 'string' && input.indexOf('/api/') !== -1)
        || (input && input.url && input.url.indexOf('/api/') !== -1);
      if (isApiCall) {
        var url = typeof input === 'string' ? input : input.url;
        url += (url.indexOf('?') === -1 ? '?' : '&') + 'staging=1';
        input = typeof input === 'string' ? url : new Request(url, input);
      }
    } catch (e) {}
    return origFetch.call(this, input, init);
  };
  document.addEventListener('DOMContentLoaded', function(){
    var b = document.createElement('div');
    b.textContent = '\u25C6 STAGING';
    b.style.cssText = 'position:fixed;bottom:14px;right:14px;z-index:9999;'
      + 'font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;font-weight:700;'
      + 'padding:7px 12px;border-radius:2px;letter-spacing:.03em;pointer-events:none;'
      + 'box-shadow:0 2px 8px rgba(0,0,0,.25);color:#fff;background:#E2173B;';
    document.body.appendChild(b);
  });
})();
</script>

<div class="msg">Dashboard CAE</div>
</body>
</html>
