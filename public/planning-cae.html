function generate(){
  prep();prepQ();
  const o={};SCD.forEach(sc=>{o[sc.id]=Object.assign({},sc,S.sc[sc.id],{dadj:{}})});
  RES={};REFB={};
  CN.forEach(c=>{const D=dEff(c);if(D>0&&Object.values(cs(c).eng).some(x=>x>0))REFB[c]=D});
  const solve=sc=>{let R;for(let pass=0;pass<4;pass++){R=plan(sc);if(pass===3)break;
      const by={};R.P.forEach(p=>{(by[p.c]=by[p.c]||[]).push(p.E)});let ch=0;
      for(const c in REFB){const Es=by[c]||[],tot=Es.reduce((x,y)=>x+y,0),D=REFB[c],s=cs(c);
        const mxM=s.maxMiss===''?Infinity:+s.maxMiss,mnM=s.minMiss===''?1:+s.minMiss;
        const avgE=tot/Math.max(Es.length,1);
        if(D-tot>avgE/2&&Es.length<mxM){sc.dadj[c]=(sc.dadj[c]||0)+Math.min(mxM-Es.length,Math.max(1,Math.round((D-tot)/avgE)));ch++}
        else if(Es.length>Math.max(mnM,1)){const so=[...Es].sort((x,y)=>x-y);let k=0,tt=tot;while(Es.length-k>Math.max(mnM,1)&&tt-so[k]-D>=-so[k]/2){tt-=so[k];k++}
          if(k>0){sc.dadj[c]=(sc.dadj[c]||0)-k;ch++}}}
      if(!ch)break}
    return R};
  RES.ref=solve(o.ref);
  SCD.slice(1).forEach(sc=>RES[sc.id]=solve(o[sc.id]));
  SCD.forEach(sc=>{RES[sc.id].K=kpis(RES[sc.id])});
}

function renderScen(){
  const rows=[
    ['Missions',k=>k.n,v=>nf(v),-1],['Recruteurs engagés (somme des équipes)',k=>k.T,v=>nf(v),-1],['Équipe moyenne',k=>k.Tavg,d1,0],
    ['Pic de recruteurs en rue en même temps',k=>k.rdPeak,v=>nf(v),-1],
    ['Dons visés (engagements des clients)',k=>k.D,nf,0],['Dons attendus',k=>k.E,nf,0],['Clients à 90 % ou plus de leur engagement en dons',k=>k.okD,v=>pc(v),1],['Objectifs de missions visés',k=>k.O,nf,0],['Taux réel attendu',k=>k.rate,t3,1],['Part de donateurs 25 ans et plus attendue',k=>k.q,v=>pc(v,1),1],['Clients au-dessus de leur minimum 25 ans et plus',k=>k.okQ,v=>pc(v),1],['Atteinte des objectifs',k=>k.att,v=>pc(v),1],['Missions qui atteignent leur objectif',k=>k.cov,v=>pc(v),1],
    ['Semaine médiane d\'atteinte de l\'objectif annuel du client',k=>k.reachMed,v=>v>=NW+1?'au-delà de S52':'S'+Math.round(v),-1],['Clients à leur objectif annuel avant fin juin',k=>k.reach26,v=>pc(v),1],
    ['Écart-type des démarrages par semaine',k=>k.sdW,d1,-1],['Maximum de démarrages en une semaine',k=>k.maxW,nf,-1],
    ['Écart à la répartition S1/S2 visée (points, clients à 2 missions et plus)',k=>k.semDev,d1,-1],['Clients à ±10 points de la répartition visée',k=>k.semOk,v=>pc(v),1],
    ['Villes de province distinctes',k=>k.cities,nf,-1],['Ouvertures ville × semaine (province)',k=>k.open,nf,-1],['Missions par ouverture',k=>k.perOpen,d1,1],
    ['Écart de missions entre responsables (max − min)',k=>k.rmSpread,nf,-1],['Points de vigilance (plafonds dépassés)',k=>k.flags.cap+k.flags.cl+k.flags.rm+k.flags.vl+k.flags.rd,nf,-1]];
  const ref=RES.ref.K;
  const best=rows.map(r=>{if(!r[3])return null;const vs=SCD.map(s=>r[1](RES[s.id].K));const b=r[3]>0?Math.max(...vs):Math.min(...vs);return b});
  const tbl='<table><thead><tr><th class="l">Indicateur</th>'+SCD.map(s=>'<th style="white-space:normal;min-width:96px"><span style="color:'+SCC[s.id]+'">●</span> '+esc(s.short)+'</th>').join('')+'</tr></thead><tbody>'+
   rows.map((r,i)=>'<tr><td class="l">'+r[0]+'</td>'+SCD.map(s=>{const v=r[1](RES[s.id].K),isB=best[i]!=null&&Math.abs(v-best[i])<1e-9&&s.id!=='ref'&&SCD.filter(x=>x.id!=='ref').some(x=>Math.abs(r[1](RES[x.id].K)-best[i])<1e-9);return '<td class="m"'+(isB?' style="background:color-mix(in srgb,var(--good) 18%,var(--surf));font-weight:600"':'')+'>'+r[2](v)+'</td>'}).join('')+'</tr>').join('')+'</tbody></table>';
  const ser=SCD.map(s=>({v:RES[s.id].K.curve,col:SCC[s.id],bold:s.id===S.sel,dash:s.id==='ref'}));
  const leg=SCD.map(s=>'<span style="margin-right:12px;white-space:nowrap"><span style="color:'+SCC[s.id]+'">━</span> '+esc(s.short)+'</span>').join('');
  const mxw=Math.max(...SCD.flatMap(s=>RES[s.id].st.slice(0,NW)));
  const cards=SCD.map(s=>{const K=RES[s.id].K;return '<div class="panel sc'+(S.sel===s.id?' sel':'')+'"><div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><b><span style="color:'+SCC[s.id]+'">●</span> '+esc(s.name)+'</b><button class="btn ghost sm" data-open="'+s.id+'">Voir le planning</button></div><p class="note" style="margin:6px 0">'+esc(s.desc)+'</p><div style="display:flex;gap:16px;align-items:end;flex-wrap:wrap"><div class="kpi"><div class="v">'+K.n+'</div><div class="l">missions</div></div><div class="kpi"><div class="v">'+K.T+'</div><div class="l">recruteurs engagés</div></div><div class="kpi"><div class="v">'+t3(K.rate)+'</div><div class="l">taux réel attendu</div></div><div>'+spark(RES[s.id].st.slice(0,NW),mxw)+'<div class="l note">démarrages par semaine</div></div></div></div>'}).join('');
  const prm='<table><thead><tr><th class="l">Paramètre</th>'+SCD.map(s=>'<th style="white-space:normal">'+esc(s.short)+'</th>').join('')+'</tr></thead><tbody>'+
   SCP.map(p=>'<tr><td class="l">'+p[1]+'</td>'+SCD.map(s=>'<td><input type="number" step="0.05" min="0" max="10" data-g="sc.'+s.id+'.'+p[0]+'" value="'+S.sc[s.id][p[0]]+'"></td>').join('')+'</tr>').join('')+'</tbody></table>';
  $('#v-scen').innerHTML='<h2>Scénarios '+PY+'</h2><p class="lead">'+SCD.length+' versions du planning à partir du même point de départ : l\'engagement en dons de '+YB+' reconduit à l\'identique ; le nombre de missions est calculé pour l\'atteindre. Chaque version applique le même modèle (taux réel, présence, simultanéité par client, responsable et ville, plafond de recruteurs) avec un objectif différent. En vert : la meilleure valeur parmi les scénarios (hors référence).</p>'+
  (PY<2027?realPY():'')+
  '<div class="grid g2">'+cards+'</div>'+
  '<div class="panel" style="margin-top:16px"><h3>Comparatif</h3>'+tw(tbl)+'<p class="note">Bulletins attendus = équipe × jours par recruteur × présence × heures de rue par jour × taux réel attendu (mois, responsable, ville, équipe et simultanéité). L\'objectif annuel d\'un client est la somme des objectifs du scénario de référence.</p></div>'+
  '<div class="panel" style="margin-top:16px"><h3>Part des objectifs annuels des clients atteinte, semaine par semaine</h3>'+lineChart(ser)+'<p class="note">'+leg+'</p></div>'+
  '<div class="panel" style="margin-top:16px"><h3>Réglages des scénarios</h3>'+tw(prm)+'<p class="note">Modifier puis « Régénérer ». Les types d\'équipe et d\'engagement sont fixés par scénario : référence = équipes historiques ; au plus vite = équipes maximales ; moins de missions et moins de RD = équipe minimale qui atteint l\'objectif.</p></div>'}

function realPY(){const m=REALP,a=m.reduce((x,r)=>({hr:x.hr+r.hr,bs:x.bs+r.bs,T:x.T+r.recr,o:x.o+r.obj,bo:x.bo+(r.obj>0?r.bs:0)}),{hr:0,bs:0,T:0,o:0,bo:0});
 return '<div class="lim"><b>Rejouer '+PY+' à partir de 2025 et avant.</b> Taux réel, présence, atteinte, facteurs mois / responsable / ville / équipe et plafonds de simultanéité sont calculés sans aucune donnée '+PY+'. Engagement par défaut = missions réalisées en '+YB+' ; équipes, durées et objectifs par mission viennent aussi de l\'historique. <b>Réalisé '+PY+' pour comparer (au 09/10/2026, année en cours) :</b> '+m.length+' missions démarrées (+ '+REALF.length+' déjà planifiées), '+a.T+' recruteurs, '+nf(a.hr)+' h de rue, '+nf(a.bs)+' bulletins, taux réel '+t3(a.bs/a.hr)+', atteinte des objectifs '+pc(a.bo/a.o)+'. Le planning rejoué couvre l\'année entière : comparer surtout les taux et la répartition.</div>'}

/* ---------- onglet planning ---------- */
function renderPlan(){
  const id=S.sel,R=RES[id],K=R.K,P=R.P,sc=SCD.find(s=>s.id===id);
  const ref=RES.ref.K,ml=R.mL,mxv=Math.max(...R.capM,...ml,...BASE26)+2;
  let svg='<svg viewBox="0 0 720 220" width="100%" role="img" aria-label="Missions planifiées par mois">';
  const bw=34,gap=(680-12*bw)/12,base=190,scy=v=>base-(v/mxv)*160;
  [0,.5,1].forEach(g=>{const y=scy(g*mxv);svg+='<line x1="30" x2="716" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="26" y="'+(y+4)+'" text-anchor="end">'+Math.round(g*mxv)+'</text>'});
  ml.forEach((v,i)=>{const x=40+i*(bw+gap)+gap/2,y=scy(v);
    svg+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+(base-y)+'" rx="2" fill="var(--acc)"/><text x="'+(x+bw/2)+'" y="'+(y-4)+'" text-anchor="middle">'+v+'</text>'+
    '<line x1="'+(x-3)+'" x2="'+(x+bw+3)+'" y1="'+scy(BASE26[i])+'" y2="'+scy(BASE26[i])+'" stroke="var(--warn)" stroke-width="2"/>'+
    '<line x1="'+(x-3)+'" x2="'+(x+bw+3)+'" y1="'+scy(R.capM[i])+'" y2="'+scy(R.capM[i])+'" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="3 2"/>'+
    '<text x="'+(x+bw/2)+'" y="206" text-anchor="middle">'+MN[i].replace('.','')+'</text>'});
  svg+='</svg>';
  const cn=[...new Set(P.map(p=>p.c))].sort((a,b)=>CL[b].note-CL[a].note);
  const mat=tw('<table class="hm"><thead><tr><th class="l">Client</th>'+MN.map(m=>'<th>'+m.replace('.','')+'</th>').join('')+'<th>'+PY+'</th><th>'+YB+'</th><th>Dons S1 / S2</th><th>Cible S1</th><th>Dons / engagement</th><th>25 ans et +</th></tr></thead><tbody>'+cn.map(n=>{const e1=P.filter(p=>p.c===n&&p.m<6).reduce((x,p)=>x+p.E,0),e2=P.filter(p=>p.c===n&&p.m>=6).reduce((x,p)=>x+p.E,0),et=e1+e2,Eq=P.filter(p=>p.c===n).reduce((x,p)=>x+p.E*p.q,0);const r=Array(12).fill(0);P.forEach(p=>{if(p.c===n)r[p.m]++});const t=r.reduce((x,y)=>x+y,0);return '<tr><td class="l">'+esc(n)+'</td>'+r.map(v=>'<td style="'+(v?'background:color-mix(in srgb,var(--acc) '+Math.min(70,v*18)+'%,var(--surf))':'')+'">'+(v||'')+'</td>').join('')+'<td><b>'+t+'</b></td><td class="note">'+CL[n].n26+'</td><td>'+(et?Math.round(e1/et*100)+' / '+Math.round(e2/et*100):'')+'</td><td class="note">'+Math.round(semT(n)*100)+' %</td><td>'+(et?nf(et)+' / '+nf(REFB[n]||0):'')+'</td><td>'+(et?pc(Eq/et,1)+' <span class="note">(min '+Math.round(qTarget(n)*100)+' %)</span>':'')+'</td></tr>'}).join('')+'</tbody></table>');
  const wl=R.rms.map(r=>{const q=P.filter(p=>p.r===r);return{r,n:q.length,T:q.reduce((x,p)=>x+p.T,0),pk:Math.max(0,...[...Array(NW)].map((_,w)=>q.filter(p=>p.w<=w&&w<p.w+p.dur).length)),cap:Math.round((CAP.r[r]||4)*S.capRM/100)}}).sort((a,b)=>b.n-a.n);
  const vl=Object.entries(P.reduce((o,p)=>{o[p.v]=(o[p.v]||0)+1;return o},{})).sort((a,b)=>b[1]-a[1]).slice(0,12);
  const opts=(arr,all)=>'<option value="">'+all+'</option>'+arr.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');
  const sw=SCD.map(s=>'<button class="tab'+(s.id===id?' on':'')+'" data-sc="'+s.id+'" style="border-bottom-color:'+(s.id===id?SCC[s.id]:'transparent')+'">'+esc(s.short)+'</button>').join('');
  const vig=K.flags.cap+K.flags.cl+K.flags.rm+K.flags.vl+K.flags.rd;
  $('#v-plan').innerHTML='<h2>Planning '+PY+'</h2><div class="tabs sw" style="margin-bottom:6px">'+sw+'</div><p class="lead">'+esc(sc.name)+'. '+esc(sc.desc)+' Démarrages le mardi, durée de 5 semaines (6 pour l\'hybride selon l\'historique du client).</p>'+
  '<div class="grid g4"><div class="panel kpi"><div class="v">'+K.n+'</div><div class="l">missions</div><div class="d">référence : '+ref.n+'</div></div>'+
  '<div class="panel kpi"><div class="v">'+K.T+'</div><div class="l">recruteurs engagés</div><div class="d">équipe moyenne '+d1(K.Tavg)+', pic '+K.rdPeak+' en rue</div></div>'+
  '<div class="panel kpi"><div class="v">'+nf(K.E)+'</div><div class="l">bulletins attendus</div><div class="d">objectifs '+nf(K.O)+' ('+pc(K.att)+') · taux '+t3(K.rate)+'</div></div>'+
  '<div class="panel kpi"><div class="v '+(vig?'warn':'')+'">'+vig+'</div><div class="l">points de vigilance</div><div class="d">'+K.flags.cap+' mois plein, '+K.flags.cl+' client, '+K.flags.rm+' responsable, '+K.flags.vl+' ville, '+K.flags.rd+' recruteurs</div></div></div>'+
  '<div class="grid g2" style="margin-top:16px"><div class="panel"><h3>Démarrages par mois</h3>'+svg+'<p class="note"><span style="color:var(--acc)">■</span> planifiés &nbsp; <span style="color:var(--warn)">━</span> démarrages '+YB+' &nbsp; <span style="color:var(--bad)">┅</span> capacité</p></div>'+
  '<div class="panel"><h3>Charge par responsable</h3>'+tw('<table><thead><tr><th class="l">Responsable</th><th>Missions</th><th>Recruteurs</th><th>Pic parallèle</th><th>Plafond</th></tr></thead><tbody>'+wl.map(w=>'<tr><td class="l">'+esc(w.r)+'</td><td class="m">'+w.n+'</td><td class="m">'+w.T+'</td><td class="m'+(w.pk>w.cap?' warn':'')+'">'+w.pk+'</td><td class="m">'+w.cap+'</td></tr>').join('')+'</tbody></table>')+'<h3 style="margin-top:14px">Villes les plus utilisées</h3><div class="chips">'+vl.map(x=>'<span class="chip">'+esc(x[0])+' · '+x[1]+'</span>').join('')+'</div></div></div>'+
  '<div class="panel" style="margin-top:16px"><h3>Missions par client et par mois</h3>'+mat+'</div>'+
  '<div class="panel" style="margin-top:16px"><h3>Liste des missions</h3><div class="filters"><label class="f">Client<select id="f-c">'+opts(cn,'Tous')+'</select></label><label class="f">Responsable<select id="f-r">'+opts(R.rms.concat(['À affecter']),'Tous')+'</select></label><label class="f">Mois<select id="f-m"><option value="">Tous</option>'+MN.map((m,i)=>'<option value="'+i+'">'+m+'</option>').join('')+'</select></label><label class="f">Affichage<select id="f-v"><option value="list">Liste</option><option value="gantt">Gantt à la semaine</option></select></label><label class="f" id="f-gw">Regrouper par<select id="f-g"><option value="c">Client</option><option value="r">Responsable</option><option value="v">Ville</option></select></label><button class="btn ghost" id="copy">Copier en CSV</button><span class="note" id="copied"></span></div><div id="plist"></div></div>';
  ['f-c','f-r','f-m','f-v','f-g'].forEach(x=>$('#'+x).addEventListener('change',e=>{if(x==='f-v')S.view=e.target.value;if(x==='f-g')S.grp=e.target.value;if(x==='f-v'||x==='f-g')save();list()}));$('#f-v').value=S.view||'list';$('#f-g').value=S.grp||'c';
  $('#copy').addEventListener('click',copyCsv);list()}
function filtered(){const c=$('#f-c').value,r=$('#f-r').value,m=$('#f-m').value;return RES[S.sel].P.filter(p=>(!c||p.c===c)&&(!r||p.r===r)&&(m===''||p.m===+m))}
const dstr=d=>d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'});
const dend=p=>new Date(p.d.getTime()+(p.dur*7-4)*864e5);
const FCOL={st:'var(--acc)',sp:'var(--good)',hy:'var(--warn)'};
function gantt(L){
  const grp=S.grp||'c',WW=22,NWK=NW+6,key=p=>grp==='c'?p.c:grp==='r'?p.r:p.v,R=RES[S.sel];
  const groups={};L.forEach(p=>(groups[key(p)]=groups[key(p)]||[]).push(p));
  const names=Object.keys(groups).sort((a,b)=>a.localeCompare(b,'fr'));
  let mh='',wk='',m0=0;
  for(let w=0;w<NWK;w++){const mm=wmonth(w);if(w===NWK-1||wmonth(w+1)!==mm){mh+='<div class="gm" style="width:'+(w-m0+1)*WW+'px">'+MN[mm]+(w>=NW-1&&mm===0?' '+(PY+1):'')+'</div>';m0=w+1}wk+='<div class="gw" style="width:'+WW+'px" title="Semaine du '+dstr(wdate(w))+'">'+(w+1)+'</div>'}
  const lab=t=>'<div class="gl">'+t+'</div>';
  let h='<div class="gantt" style="--ww:'+WW+'px"><div class="grow ghead">'+lab('')+'<div class="gtrack" style="width:'+NWK*WW+'px"><div class="gline">'+mh+'</div><div class="gline">'+wk+'</div></div></div>';
  names.forEach(n=>{const q=groups[n].slice().sort((a,b)=>a.w-b.w),ends=[];
    q.forEach(p=>{let i=ends.findIndex(e=>e<=p.w);if(i<0){i=ends.length;ends.push(0)}ends[i]=p.w+p.dur;p.lane=i});
    h+='<div class="grow">'+lab(esc(n)+' <span class="note">'+q.length+'</span>')+'<div class="gtrack gbody" style="width:'+NWK*WW+'px;height:'+(ends.length*20+6)+'px">'+
    q.map(p=>'<div class="gbar" style="left:'+p.w*WW+'px;width:'+(p.dur*WW-2)+'px;top:'+(p.lane*20+3)+'px;background:'+FCOL[p.f]+'" title="'+esc(p.c+' · '+ftName(p.k)+' · '+p.v+' · '+p.r+' · équipe '+p.T+' · '+dstr(p.d)+' au '+dstr(dend(p))+' · attendu '+nf(p.E)+' / objectif '+nf(p.obj))+'">'+esc((grp==='c'?p.v:p.c)+' · '+p.T)+'</div>').join('')+'</div></div>'});
  const cnt=a=>'<div class="gtrack" style="width:'+NWK*WW+'px;display:flex">'+Array.from({length:NWK},(_,w)=>'<div class="gw" style="width:'+WW+'px">'+(a[w]||'')+'</div>').join('')+'</div>';
  h+='<div class="grow gfoot">'+lab('Démarrages (tous)')+cnt(R.st)+'</div><div class="grow gfoot">'+lab('Recruteurs en rue (tous)')+cnt(R.rdL.map(x=>x||''))+'</div></div>';
  return h+'<p class="note"><span style="color:var(--acc)">■</span> Rue &nbsp; <span style="color:var(--good)">■</span> Sites privés &nbsp; <span style="color:var(--warn)">■</span> Hybride. Libellé de la barre : '+(grp==='c'?'ville':'client')+' · taille d\'équipe. Passer la souris sur une barre pour le détail. Les lignes du bas portent sur tout le planning, hors filtres.</p>'}
function list(){const L=filtered();
  $('#f-gw').style.display=S.view==='gantt'?'':'none';
  if(S.view==='gantt'){$('#plist').innerHTML=gantt(L)+'<p class="note">'+L.length+' missions affichées.</p>';return}
  $('#plist').innerHTML=tw('<table><thead><tr><th class="l">Démarrage</th><th class="l">Fin</th><th class="l">Client</th><th class="l">Format</th><th class="l">Ville</th><th class="l">Responsable</th><th>Équipe</th><th>Objectif</th><th>Attendu</th><th>Atteinte</th><th>Taux</th></tr></thead><tbody>'+L.map(p=>'<tr><td class="l m">'+dstr(p.d)+'</td><td class="l m">'+dstr(dend(p))+'</td><td class="l">'+esc(p.c)+' <span class="badge b-'+p.grade+'">'+p.grade+'</span></td><td class="l">'+ftName(p.k)+'</td><td class="l">'+esc(p.v)+(p.vs==='sugg'?' <span class="note">(suggestion)</span>':p.vs==='tbd'?' <span class="note">(à définir)</span>':'')+'</td><td class="l">'+esc(p.r)+'</td><td class="m">'+p.T+'</td><td class="m">'+nf(p.obj)+'</td><td class="m">'+nf(p.E)+'</td><td class="m'+(p.att<.95?' warn':'')+'">'+pc(p.att)+'</td><td class="m">'+t3(p.rate)+'</td></tr>').join('')+'</tbody></table>')+'<p class="note">'+L.length+' missions affichées.</p>'}
function copyCsv(){const L=filtered();const t=['Démarrage\tFin\tClient\tFormat\tZone\tVille\tResponsable\tÉquipe\tObjectif\tAttendu'].concat(L.map(p=>[p.d.toISOString().slice(0,10),dend(p).toISOString().slice(0,10),p.c,FTL[p.f],ZL[p.z],p.v,p.r,p.T,p.obj,Math.round(p.E)].join('\t'))).join('\n');
  const ok=()=>{$('#copied').textContent='Copié ('+L.length+' lignes, séparées par tabulation)'},ko=()=>{$('#copied').textContent='Copie impossible ici : sélectionner le tableau à la main'};
  try{navigator.clipboard.writeText(t).then(ok,ko)}catch(e){ko()}}

/* ---------- interactions ---------- */
let dirty=false;
function mark(){dirty=true;$('#dirty').hidden=false;save()}
function showTab(v){document.querySelectorAll('.tab[data-v]').forEach(t=>t.setAttribute('aria-selected',t.dataset.v===v));document.querySelectorAll('.view').forEach(x=>x.hidden=x.id!=='v-'+v);window.scrollTo(0,0)}
function run(){generate();dirty=false;$('#dirty').hidden=true;renderSynth();renderNotes();renderScen();renderPlan();const open=[...document.querySelectorAll('details.cl[open]')].map(e=>e.id);renderEng();open.forEach(id=>{const e=$('#'+id);if(e)e.open=true});save()}
$('#regen').addEventListener('click',run);
$('#reset').addEventListener('click',()=>{const sel=S.sel;S=clone(DEF);S.sel=sel;CS={};CN.forEach(cs);run()});
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)showTab(b.dataset.v)});
$('#v-notes').addEventListener('click',e=>{const tr=e.target.closest('tr.click');if(!tr)return;const d=$('#d'+tr.dataset.i);d.hidden=!d.hidden});
$('#v-scen').addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(!b)return;S.sel=b.dataset.open;save();renderScen();renderPlan();showTab('plan')});
$('#v-plan').addEventListener('click',e=>{const b=e.target.closest('[data-sc]');if(!b)return;S.sel=b.dataset.sc;save();renderPlan();renderScen()});
const toggle=(arr,v)=>{const i=arr.indexOf(v);i>=0?arr.splice(i,1):arr.push(v)};
$('#v-eng').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;const a=b.dataset.act;
  if(a==='gresp'){S.resp[b.dataset.m]=!S.resp[b.dataset.m];b.classList.toggle('on');mark();return}
  const s=cs(CN[+b.dataset.ci]);
  if(a==='ex'){const m=+b.dataset.m;toggle(s.ex,m);if(s.ex.includes(m))s.pref=s.pref.filter(x=>x!==m)}
  else if(a==='pref'){const m=+b.dataset.m;toggle(s.pref,m);if(s.pref.includes(m))s.ex=s.ex.filter(x=>x!==m)}
  else if(a==='exr'){toggle(s.exR,b.dataset.m)}
  mark();const open=$('#cl'+b.dataset.ci).open;renderEng();$('#cl'+b.dataset.ci).open=open});
function setPath(path,v){const p=path.split('.');let o=S;for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=v}
function onEng(e){const t=e.target;
  if(t.dataset.act==='rmcap'||t.dataset.act==='vlcap'){(t.dataset.act==='rmcap'?S.rmCap:S.vlCap)[t.dataset.m]=Math.max(1,+t.value||1);mark();return}
  if(t.dataset.g){const v=+t.value;
    if(t.dataset.g==='cap')S.cap[+t.dataset.i]=Math.max(0,v||0);else setPath(t.dataset.g,v);
    const o=$('#o-'+t.id);if(o)o.textContent=v;mark();return}
  const a=t.dataset.act;if(!a)return;const ci=t.dataset.ci,s=cs(CN[+ci]);
  if(a==='eng'){s.eng[t.dataset.k]=Math.max(0,+t.value||0);}
  else if(a==='addft'){if(t.value){s.eng[t.value]=1;mark();const o=$('#cl'+ci).open;renderEng();$('#cl'+ci).open=o;return}}
  else if(a==='cdons'){s.dons=t.value===''?'':Math.max(0,+t.value||0);$('#tot'+ci).textContent=PY+' : '+nf(dEff(CN[+ci]))+' dons'}
  else if(a==='cmin')s.minMiss=t.value===''?'':Math.max(1,+t.value||1);
  else if(a==='cmax')s.maxMiss=t.value===''?'':Math.max(1,+t.value||1);
  else if(a==='ccap')s.capCl=t.value===''?'':Math.max(1,+t.value||1);
  else if(a==='cqmin')s.qMin=t.value===''?'':clamp(+t.value,0,100);
  else if(a==='csem')s.sem=t.value===''?'':clamp(+t.value,0,100);
  else if(a==='cmult')s.mult=Math.max(0,+t.value||0);
  else if(a==='cmaxw')s.maxW=t.value===''?'':Math.max(1,+t.value);
  else if(a==='tmax')s.tmax=t.value===''?'':Math.max(2,+t.value);
  else if(a==='bonus')s.bonus=+t.value||0;
  else if(a==='impr')s.impR=t.value;
  mark()}
$('#v-eng').addEventListener('input',onEng);
$('#v-eng').addEventListener('change',e=>{if(e.target.tagName==='SELECT')onEng(e)});
$('#v-scen').addEventListener('input',e=>{if(e.target.dataset.g){setPath(e.target.dataset.g,+e.target.value);mark()}});
run();

(function(){const h=$('#h1');if(h)h.textContent='Planning '+PY;document.title='Planning '+PY+' CAE';
 const pt=document.querySelector('[data-v="plan"]');if(pt)pt.textContent='Planning '+PY;
 document.querySelectorAll('#yr [data-y]').forEach(b=>{b.setAttribute('aria-selected',String(+b.dataset.y===PY));b.addEventListener('click',()=>{try{localStorage.setItem('planning-year',b.dataset.y)}catch(e){}location.reload()})})})();

</script>
